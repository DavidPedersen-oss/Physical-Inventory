
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Asset Management — CSULB Property Management</title>
<meta name="description" content="CSULB Property Management asset lookup and physical inventory portal">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1017">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ==========================================================
   Beach Asset Management — "Horizon" UI 4.0
   Modern SaaS design system: Inter, crisp white surfaces,
   layered soft shadows, 12px radii, subtle gradients,
   hover-lift cards, staggered fade-ins, first-class dark mode.
   ========================================================== */
:root{
  --gold:#FFC72C; --gold-hi:#FFD65C; --gold-deep:#7A6200; --gold-soft:#FFF6DC;
  --rowH:44px; --radius:12px; --radius-s:10px; --nav-h:64px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.68,.35,1);
  --spring:cubic-bezier(.34,1.4,.44,1);
}
[data-theme="light"]{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F1F3F7; --ink:#0F172A; --ink2:#64748B;
  --line:#E7EAF0; --line2:#D4DAE3; --accent:#8A6D00; --accent-fill:#FFC72C; --accent-soft:#FFF6DC;
  --ok:#15803D; --ok-bg:#E5F5EA; --bad:#DC2626; --bad-bg:#FDEAEA; --warn:#A16207; --warn-bg:#FBF3D9;
  --dmg:#9333EA; --dmg-bg:#F5EBFC; --oth:#0E7490; --oth-bg:#E4F2F6; --un:#71717A; --un-bg:#EEEFF2;
  --shadow-xs:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);
  --shadow-sm:0 2px 4px rgba(15,23,42,.04),0 6px 16px -6px rgba(15,23,42,.10);
  --shadow-md:0 4px 8px rgba(15,23,42,.05),0 14px 32px -10px rgba(15,23,42,.14);
  --shadow-lg:0 8px 16px rgba(15,23,42,.06),0 28px 64px -16px rgba(15,23,42,.22);
  --shadow:var(--shadow-lg);
  --header-bg:#0D1017; --header-ink:#F1F3F7;
  --page-glow:radial-gradient(900px 420px at 85% -8%,rgba(255,199,44,.06),transparent 60%);
}
[data-theme="dark"]{
  --bg:#0B0E14; --surface:#12161F; --surface2:#1A202C; --ink:#E7EBF3; --ink2:#8D99AC;
  --line:#20283A; --line2:#32405C; --accent:#FFD35C; --accent-fill:#FFC72C; --accent-soft:#2C2510;
  --ok:#4ADE80; --ok-bg:#12321D; --bad:#F87171; --bad-bg:#3B1A1A; --warn:#FACC15; --warn-bg:#37300F;
  --dmg:#C084FC; --dmg-bg:#2E1B3E; --oth:#67E8F9; --oth-bg:#123039; --un:#8D99AC; --un-bg:#1E2530;
  --shadow-xs:0 1px 2px rgba(0,0,0,.5);
  --shadow-sm:0 2px 6px rgba(0,0,0,.45),0 8px 20px -8px rgba(0,0,0,.5);
  --shadow-md:0 4px 10px rgba(0,0,0,.5),0 16px 36px -12px rgba(0,0,0,.6);
  --shadow-lg:0 10px 20px rgba(0,0,0,.5),0 32px 72px -18px rgba(0,0,0,.75);
  --shadow:var(--shadow-lg);
  --header-bg:#080A0F; --header-ink:#F1F3F7;
  --page-glow:radial-gradient(900px 420px at 85% -8%,rgba(255,199,44,.05),transparent 60%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);height:100%;overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"cv02","cv03","cv11"}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--radius-s);padding:10px 13px;width:100%;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-fill);box-shadow:0 0 0 3.5px rgba(255,199,44,.22)}
button:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px}
::placeholder{color:var(--ink2);opacity:.7}
::selection{background:var(--gold-soft);color:#0F172A}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.hidden{display:none!important}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2.5px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2.5px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ Motion library ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}}
@keyframes growBar{from{width:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes dropin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
@keyframes risein{from{opacity:0;transform:translateX(-50%) translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes slidein{from{transform:translateX(48px);opacity:0}}
@keyframes wob{0%{transform:rotate(0)}30%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}100%{transform:rotate(0)}}
main.page-in>*{animation:fadeUp .34s var(--ease) both}
main.page-in>*:nth-child(1){animation-delay:.02s}
main.page-in>*:nth-child(2){animation-delay:.06s}
main.page-in>*:nth-child(3){animation-delay:.10s}
main.page-in>*:nth-child(4){animation-delay:.14s}
main.page-in>*:nth-child(5){animation-delay:.17s}
main.page-in>*:nth-child(n+6){animation-delay:.20s}
#sres .acard,#dcards .acard,#slist .srow,#dlist .dept-row{animation:fadeUp .3s var(--ease) both}
#sres .acard:nth-child(-n+8){animation-delay:calc(var(--i,0)*0s)}
#sres .acard:nth-child(2),#dcards .acard:nth-child(2),#slist .srow:nth-child(2){animation-delay:.04s}
#sres .acard:nth-child(3),#dcards .acard:nth-child(3),#slist .srow:nth-child(3){animation-delay:.08s}
#sres .acard:nth-child(4),#dcards .acard:nth-child(4),#slist .srow:nth-child(4){animation-delay:.12s}
#sres .acard:nth-child(5),#dcards .acard:nth-child(5),#slist .srow:nth-child(5){animation-delay:.15s}
#sres .acard:nth-child(n+6),#dcards .acard:nth-child(n+6),#slist .srow:nth-child(n+6){animation-delay:.18s}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);
  background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:8px;color:transparent!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ Login ============ */
#login{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background:#090B10;overflow:hidden}
#login::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(720px 480px at 80% -12%,rgba(255,199,44,.16),transparent 62%),
    radial-gradient(560px 460px at -10% 110%,rgba(94,140,255,.10),transparent 60%),
    linear-gradient(180deg,transparent 60%,rgba(255,199,44,.03))}
#login::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
.login-card{position:relative;z-index:1;background:var(--surface);border-radius:18px;padding:36px 32px 30px;width:100%;max-width:410px;
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.04);border:1px solid var(--line);animation:cardin .45s var(--spring)}
.login-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand-tag{font-weight:700;font-size:10.5px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase}
.login-card h1{font-size:28px;line-height:1.1;letter-spacing:-.03em;margin-bottom:8px;font-weight:800}
.login-card .sub{color:var(--ink2);font-size:14px;line-height:1.55;margin-bottom:24px}
.login-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink2);font-size:12px;
  display:flex;align-items:center;gap:7px}
.login-foot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;
  box-shadow:0 0 8px rgba(255,199,44,.8)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.02em}
.login-err{color:var(--bad);font-size:13.5px;font-weight:600;margin-top:10px;min-height:18px}

/* logo mark (shared: login + header) */
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo-mark{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,#E8A80C);
  box-shadow:0 2px 12px rgba(255,199,44,.4),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .3s var(--spring)}
.logo:hover .logo-mark{animation:wob .5s var(--ease)}
.logo-mark.lg{width:44px;height:44px;border-radius:12px}
.ttl{display:flex;flex-direction:column;line-height:1.16;min-width:0}
.ttl b{font-weight:750;font-size:15px;letter-spacing:-.01em;color:var(--header-ink);white-space:nowrap}
.ttl em{font-style:normal;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7C8698;white-space:nowrap}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-s);padding:11px 18px;
  font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line2);min-height:44px;color:var(--ink);
  transition:transform .12s var(--spring),background .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease);
  box-shadow:var(--shadow-xs)}
.btn:hover{background:var(--surface2);border-color:var(--line2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98);box-shadow:var(--shadow-xs)}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#231A05;border-color:transparent;font-weight:700;
  box-shadow:0 1px 2px rgba(15,23,42,.1),0 4px 14px -3px rgba(255,199,44,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{background:linear-gradient(180deg,#FFE18E,var(--gold-hi));box-shadow:0 2px 4px rgba(15,23,42,.1),0 8px 20px -4px rgba(255,199,44,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-dark{background:var(--header-bg);color:var(--header-ink);border-color:transparent}
.btn-dark:hover{background:#1C2230}
.btn-danger{background:var(--bad-bg);color:var(--bad);border-color:transparent;box-shadow:none}
.btn-danger:hover{background:var(--bad-bg);filter:brightness(.96)}
.btn-block{width:100%}
.btn-sm{padding:7px 13px;font-size:13px;min-height:36px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}

/* ============ App shell ============ */
#app{display:none;height:100%}
#app.on{display:flex;flex-direction:column}
header.top{background:var(--header-bg);color:var(--header-ink);display:flex;align-items:center;gap:12px;
  padding:9px 16px;padding-top:max(9px,env(safe-area-inset-top));flex:none;position:relative;z-index:10}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,rgba(255,199,44,.9),rgba(255,199,44,.15) 45%,rgba(255,255,255,.06) 80%)}
header.top .grow{flex:1}
.sync-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;
  background:rgba(255,255,255,.05);color:#B9C2D0;border:1px solid rgba(255,255,255,.1);min-height:34px;
  transition:background .16s var(--ease),transform .12s var(--spring)}
.sync-chip:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.sync-chip .dot{width:8px;height:8px;border-radius:50%;background:#5B6472;box-shadow:0 0 0 3px rgba(255,255,255,.05);transition:background .2s}
.sync-chip.ok .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(255,199,44,.16),0 0 8px rgba(255,199,44,.6)}
.sync-chip.pend .dot{background:#FB923C;box-shadow:0 0 0 3px rgba(251,146,60,.16)}
.sync-chip.err .dot{background:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.16)}
.sync-chip.busy .dot{background:#38BDF8;box-shadow:0 0 0 3px rgba(56,189,248,.16);animation:pulse 1s infinite}
.user-pill{font-size:13px;color:#B9C2D0;display:flex;align-items:center;gap:10px}
.avatar{width:31px;height:31px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#231A05;font-weight:800;font-size:11.5px;letter-spacing:.02em;
  box-shadow:0 0 0 2px rgba(255,199,44,.25)}
#logoutBtn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#B9C2D0;box-shadow:none}
#logoutBtn:hover{background:rgba(255,255,255,.12)}
body.is-mobile .user-pill .uname{display:none}

.shell{display:flex;flex:1;min-height:0}
nav.side{width:230px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
nav.side .nav-it,nav.bottom .nav-it{display:flex;align-items:center;gap:12px;padding:9px 13px;border-radius:10px;
  font-weight:550;font-size:13.5px;color:var(--ink2);width:100%;text-align:left;position:relative;
  transition:background .14s var(--ease),color .14s var(--ease),transform .12s var(--spring)}
nav.side .nav-it svg{flex:none;opacity:.8;transition:transform .2s var(--spring)}
nav.side .nav-it:hover{background:var(--surface2);color:var(--ink)}
nav.side .nav-it:hover svg{transform:scale(1.12)}
nav.side .nav-it.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
nav.side .nav-it.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:var(--gold)}
nav.side .nav-it.on svg{opacity:1}
nav.side .nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
  padding:16px 13px 5px;opacity:.75}
nav.bottom{display:none}
main{flex:1;overflow-y:auto;min-width:0;padding:24px 28px 96px;-webkit-overflow-scrolling:touch;
  background:var(--page-glow),var(--bg)}
.page-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h2{font-size:23px;font-weight:750;letter-spacing:-.025em}
.page-h .cnt{color:var(--ink2);font-size:13px;font-weight:550}

/* Mobile shell */
@media(max-width:899px){
  nav.side{display:none}
  main{padding:16px 14px 122px}
  .page-h h2{font-size:20px}
  nav.bottom{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:60;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md);padding:4px 4px}
  nav.bottom .nav-it{flex:1;flex-direction:column;gap:3px;font-size:10px;font-weight:600;padding:8px 1px 7px;
    align-items:center;min-height:calc(var(--nav-h) - 8px);border-radius:12px;color:var(--ink2)}
  nav.bottom .nav-it.on{color:var(--accent);background:var(--accent-soft)}
  nav.bottom .nav-it.on svg{stroke:var(--accent);transform:translateY(-1px)}
  nav.bottom .nav-it svg{transition:transform .2s var(--spring)}
  header.top .ttl em{display:none}
}

/* ============ Search ============ */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{padding:15px 46px 15px 48px;font-size:16.5px;border-radius:14px;background:var(--surface);
  border-color:var(--line);box-shadow:var(--shadow-sm)}
.search-wrap input:focus{box-shadow:var(--shadow-md),0 0 0 3.5px rgba(255,199,44,.2)}
.search-wrap .s-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink2);display:flex}
.search-wrap .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:9px;color:var(--ink2);border-radius:99px}
.search-wrap .s-clear:hover{background:var(--surface2)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink2);min-height:36px;transition:all .14s var(--ease),transform .12s var(--spring)}
.chip:hover{border-color:var(--ink2);color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-xs)}
.chip.on{background:var(--header-bg);color:var(--gold);border-color:var(--header-bg);box-shadow:var(--shadow-sm)}

/* ============ Cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  margin-bottom:10px;box-shadow:var(--shadow-xs)}
.acard{display:flex;gap:13px;align-items:flex-start;transition:border-color .16s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.acard:hover{border-color:var(--line2);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.acard .ck{margin-top:4px}
.acard .body{flex:1;min-width:0;cursor:pointer}
.tagchip{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.02em;color:var(--ink);
  background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--gold);
  padding:3px 9px 3px 8px;border-radius:7px}
.acard .desc{font-size:14.5px;margin:8px 0;line-height:1.45}
.kv{font-size:12.5px;color:var(--ink2);display:flex;gap:5px 16px;flex-wrap:wrap}
.kv b{color:var(--ink);font-weight:600}
.acard .acts{display:flex;flex-direction:column;gap:7px;flex:none}
.qok{width:44px;height:44px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:800;font-size:17px;
  border:1px solid transparent;transition:all .16s var(--ease),transform .15s var(--spring)}
.qok:hover{border-color:var(--ok);transform:scale(1.08)}
.qok:active{transform:scale(.94)}
.qok.done{background:var(--ok);color:#fff;box-shadow:0 3px 10px rgba(21,128,61,.4)}
.qmore{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);font-size:19px;
  transition:all .16s var(--ease)}
.qmore:hover{color:var(--ink);box-shadow:var(--shadow-xs)}
.stat-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px 3px 8px;
  border-radius:99px;letter-spacing:.01em;white-space:nowrap}
.stat-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st-Unreviewed{background:var(--un-bg);color:var(--un)} .st-VerifiedOK{background:var(--ok-bg);color:var(--ok)}
.st-NotFound{background:var(--bad-bg);color:var(--bad)} .st-WrongLocation{background:var(--warn-bg);color:var(--warn)}
.st-Damaged{background:var(--dmg-bg);color:var(--dmg)} .st-Other{background:var(--oth-bg);color:var(--oth)}
.st-Disposed{background:var(--header-bg);color:#AEB6C4}
.srv-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);border:1px solid rgba(255,199,44,.5)}
/* lifecycle segmented toggle */
.lc-seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.lc-seg button{padding:6px 15px;font-size:12.5px;font-weight:650;letter-spacing:.01em;color:var(--ink2);
  min-height:32px;border-radius:99px;transition:all .16s var(--ease)}
.lc-seg button:hover{color:var(--ink)}
.lc-seg button.on{background:var(--header-bg);color:var(--gold);box-shadow:var(--shadow-xs)}
/* autofill suggestions */
.sugg-wrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line2);
  border-radius:12px;box-shadow:var(--shadow-lg);z-index:120;max-height:218px;overflow-y:auto;overflow-x:hidden;
  animation:dropin .18s var(--ease)}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 13px;
  font-size:13.5px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:none}
.sugg button:hover,.sugg button.hot{background:var(--accent-soft)}
.sugg .freq{color:var(--ink2);font-size:11px;font-family:var(--mono);flex:none}
.srv-card{border-left:3px solid var(--gold);background:var(--surface2);border-radius:0 10px 10px 0;
  padding:10px 13px;margin:7px 0;font-size:12.5px;line-height:1.55;transition:background .15s var(--ease)}
.srv-card[style*="cursor"]:hover{background:var(--accent-soft)}

/* ============ Surveys / auctions ============ */
.srow{cursor:pointer;display:block;transition:border-color .16s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.srow:hover{border-color:var(--line2);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.srow-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.srow-desc{font-size:13.5px;color:var(--ink);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scat{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;background:var(--ink2)}
.scat-CI{background:#2563EB}.scat-CNI{background:#0891B2}.scat-TR{background:#7C3AED}.scat-FDN{background:#B45309}.scat-BK{background:#0F766E}.scat-NEW{background:#BE123C}
.spill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink2)}
.spill.open{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-fill)}
.spill.arc{opacity:.7}

/* ============ Departments ============ */
.div-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:700;
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.div-h::after{content:"";flex:1;height:1px;background:var(--line2)}
.dept-row{display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .16s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.dept-row:hover{border-color:var(--line2);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.dept-row .nm{font-weight:600;font-size:14.5px}
.dept-row .sub{font-size:12px;color:var(--ink2);font-family:var(--mono);margin-top:3px}
.dept-row .right{margin-left:auto;text-align:right;flex:none}
.tool-ic{display:flex;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:9px;flex:none}
.meter{height:7px;border-radius:99px;background:var(--un-bg);overflow:hidden;width:116px;margin-top:6px}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-hi),var(--gold));border-radius:99px;
  transition:width .3s var(--ease);animation:growBar .7s var(--ease)}
.meter.full>i{background:linear-gradient(90deg,#34C463,var(--ok))}
.dept-row .pct{font-size:12.5px;font-weight:700;font-family:var(--mono)}

/* ============ Table ============ */
.tbl-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbl-tools input,.tbl-tools select{width:auto;font-size:14px;padding:8px 12px;min-height:40px}
.tbl-tools input[type=search]{flex:1;min-width:160px}
.vt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.vt-scroll{overflow:auto;max-height:calc(100vh - 250px);position:relative}
.vt-head,.vt-row{display:grid;align-items:center;min-width:max-content}
.vt-head{position:sticky;top:0;z-index:5;background:var(--surface2);border-bottom:1px solid var(--line2);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
.vt-head .c{padding:11px 10px;cursor:pointer;user-select:none;white-space:nowrap;display:flex;gap:5px;align-items:center;
  transition:color .14s var(--ease)}
.vt-head .c:hover{color:var(--ink)}
.vt-head .c.sorted{color:var(--accent)}
.vt-body{position:relative}
.vt-row{position:absolute;left:0;right:0;height:var(--rowH);border-bottom:1px solid var(--line);font-size:13.5px;
  cursor:pointer;min-width:max-content;background:var(--surface);transition:background .12s var(--ease)}
.vt-row:hover{background:var(--surface2)}
.vt-row.sel{background:var(--accent-soft)}
.vt-row .c{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .num{text-align:right;font-family:var(--mono);font-size:12.5px}
.vt .ck-c{width:42px;display:flex;justify-content:center}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent-fill);flex:none;border-radius:6px}

/* Bulk bar */
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;background:var(--header-bg);
  color:var(--header-ink);border-radius:16px;box-shadow:var(--shadow-lg);display:flex;gap:7px;align-items:center;
  padding:10px 14px;flex-wrap:wrap;max-width:96vw;border:1px solid rgba(255,255,255,.1);animation:risein .28s var(--spring)}
@media(max-width:899px){.bulkbar{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}}
.bulkbar .n{font-weight:800;color:var(--gold);font-family:var(--mono);font-size:14px;padding:0 4px}
.bulkbar .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.13);color:#DEE3EC;
  padding:8px 12px;font-size:12.5px;min-height:38px;box-shadow:none}
.bulkbar .btn:hover{background:rgba(255,255,255,.14);transform:none}

/* ============ Detail panel ============ */
.panel-veil{position:fixed;inset:0;background:rgba(8,10,15,.5);z-index:90;animation:fade .18s;backdrop-filter:blur(3px)}
.panel{position:fixed;top:0;right:0;bottom:0;width:500px;max-width:100vw;background:var(--surface);z-index:95;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-radius:18px 0 0 18px;
  border-left:1px solid var(--line);animation:slidein .26s var(--ease)}
@media(max-width:899px){
  .panel{width:100vw;top:34px;border-radius:18px 18px 0 0;border-left:none;border-top:1px solid var(--line);animation:slideup .28s var(--ease)}
  @keyframes slideup{from{transform:translateY(70px);opacity:0}}
  .panel-h::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:42px;height:4px;
    border-radius:99px;background:var(--line2)}
}
.panel-h{position:relative;padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top));border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:11px;flex:none}
.panel-b{flex:1;overflow-y:auto;padding:18px 20px 28px}
.panel-f{flex:none;border-top:1px solid var(--line);padding:13px 20px;padding-bottom:max(13px,env(safe-area-inset-bottom));
  display:flex;gap:9px;background:var(--surface);border-radius:0 0 0 18px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 18px}
.stat-grid .sb{border:1.5px solid var(--line2);border-radius:10px;padding:11px 8px;font-weight:650;font-size:13.5px;
  text-align:center;min-height:46px;background:var(--surface);transition:all .14s var(--ease),transform .12s var(--spring)}
.stat-grid .sb:hover{border-color:var(--ink2);transform:translateY(-1px)}
.stat-grid .sb:active{transform:scale(.97)}
.stat-grid .sb.on.st-VerifiedOK{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 3px 12px rgba(21,128,61,.35)}
.stat-grid .sb.on.st-NotFound{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 3px 12px rgba(220,38,38,.35)}
.stat-grid .sb.on.st-WrongLocation{background:var(--warn);color:#fff;border-color:var(--warn);box-shadow:0 3px 12px rgba(161,98,7,.35)}
.stat-grid .sb.on.st-Damaged{background:var(--dmg);color:#fff;border-color:var(--dmg);box-shadow:0 3px 12px rgba(147,51,234,.35)}
.stat-grid .sb.on.st-Other{background:var(--oth);color:#fff;border-color:var(--oth);box-shadow:0 3px 12px rgba(14,116,144,.35)}
.stat-grid .sb.on.st-Unreviewed{background:var(--un);color:#fff;border-color:var(--un)}
.hist{font-size:12.5px;border-left:3px solid var(--line2);padding:3px 0 3px 13px;margin:9px 0;color:var(--ink2);line-height:1.55}
.hist b{color:var(--ink)}
.ro-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px;font-size:13px;margin-bottom:14px;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.ro-grid .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin-bottom:2px}

/* ============ Stats ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;
  box-shadow:var(--shadow-xs);transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .16s var(--ease)}
.kpi:hover{box-shadow:var(--shadow-sm)}
.kpi[style*="cursor"]:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--line2)}
.kpi .v{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--ink2);font-weight:650;margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.kpi.gold{position:relative;display:flex;align-items:center;gap:14px;grid-column:span 2;overflow:hidden;
  background:linear-gradient(135deg,#161A24 0%,#0B0E14 100%);border-color:#242C3E}
.kpi.gold::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(240px 150px at 88% -20%,rgba(255,199,44,.22),transparent 65%)}
.kpi.gold .v{color:var(--gold)} .kpi.gold .l{color:#9AA4B5}
.ring{--p:0;position:relative;width:62px;height:62px;flex:none;display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0);
  -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 7px),#000 calc(100% - 6px));
          mask:radial-gradient(farthest-side,#0000 calc(100% - 7px),#000 calc(100% - 6px));
  transition:background .5s var(--ease)}
.ring b{font-family:var(--mono);font-size:14px;color:var(--gold);letter-spacing:-.02em}
@media(max-width:480px){.kpi.gold{grid-column:span 1;flex-direction:column;align-items:flex-start}}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hbar .lb{width:122px;flex:none;font-weight:600}
.hbar .tr{flex:1;height:13px;background:var(--un-bg);border-radius:99px;overflow:hidden}
.hbar .tr>i{display:block;height:100%;border-radius:99px;transition:width .3s var(--ease);animation:growBar .8s var(--ease)}
.hbar .n{font-family:var(--mono);font-size:12px;width:74px;text-align:right;flex:none}

/* ============ Forms / modals / toasts ============ */
.modal-veil{position:fixed;inset:0;background:rgba(8,10,15,.55);z-index:110;display:flex;align-items:center;
  justify-content:center;padding:18px;backdrop-filter:blur(3px);animation:fade .18s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:480px;width:100%;
  padding:24px;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;animation:cardin .26s var(--spring)}
.modal h3{margin-bottom:9px;font-size:17px;letter-spacing:-.015em;font-weight:700}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;
  gap:8px;width:min(420px,92vw)}
.toast{background:rgba(13,16,23,.86);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  color:var(--header-ink);padding:12px 16px 12px 14px;border-radius:12px;
  font-size:13.5px;font-weight:550;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;gap:10px;animation:dropin .28s var(--spring)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;
  box-shadow:0 0 0 3px rgba(255,199,44,.18),0 0 8px rgba(255,199,44,.5)}
.toast.err::before{background:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.18)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);min-height:34px;border-radius:8px;
  transition:all .16s var(--ease)}
.seg button.on{background:var(--header-bg);color:var(--gold);box-shadow:var(--shadow-xs)}
.note{font-size:13px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;line-height:1.55;margin:10px 0}
.code-box{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:11px;word-break:break-all;user-select:all;white-space:pre-wrap}
.imp-row{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:none}
table.plain{border-collapse:collapse;width:100%;font-size:13px}
table.plain th,table.plain td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.plain th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700}
table.plain tr:last-child td{border-bottom:none}
.spin{width:18px;height:18px;border:2.5px solid var(--line2);border-top-color:var(--gold);border-radius:50%;
  animation:rot .7s linear infinite;display:inline-block;vertical-align:-4px}
.load-quip{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--ink2);padding:4px 0}

/* ============ Command palette ============ */
.cp-modal{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.4)}
[data-theme="dark"] .cp-modal{background:rgba(18,22,31,.82);border-color:rgba(255,255,255,.08)}
.cp-item{cursor:pointer;transition:background .1s var(--ease)}
.cp-item:hover{background:var(--surface2)}
#cpQ{width:100%}

/* ============ Ask AI ============ */
.chat-box{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.chat-msg{max-width:78%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.55;
  animation:fadeUp .3s var(--ease) both;box-shadow:var(--shadow-xs);white-space:pre-wrap;word-break:break-word}
.chat-msg.me{align-self:flex-end;background:var(--header-bg);color:var(--header-ink);border-bottom-right-radius:5px}
.chat-msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.chat-msg.ai b{color:var(--accent)}
.chat-msg .tooluse{font-size:11.5px;color:var(--ink2);font-family:var(--mono);margin-top:6px}
.chat-sugg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chat-form{display:flex;gap:9px;position:sticky;bottom:0}
.chat-form input{flex:1;box-shadow:var(--shadow-sm)}
.ai-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:3px;animation:pulse 1s infinite}
.ai-dot:nth-child(2){animation-delay:.2s}.ai-dot:nth-child(3){animation-delay:.4s}

/* ============ Scanner ============ */
.scan-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-height:60vh}
.scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:12%;border:2.5px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="login-head">
      <span class="logo-mark lg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14130A" stroke-width="2.6" stroke-linecap="round"><path d="M3 15.5c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0M3 9c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0"/></svg></span>
      <span class="brand-tag">CSULB · Property Management</span>
    </div>
    <h1>Beach Asset<br>Management</h1>
    <div class="sub">Asset lookup, physical inventory, surveys &amp; disposals — built for the field.</div>
    <div id="loginForm">
      <div class="field"><label for="lgU">Username</label><input id="lgU" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="lgP">Password</label><input id="lgP" type="password" autocomplete="current-password"></div>
      <button class="btn btn-gold btn-block" id="lgGo">Sign in</button>
      <div class="login-err" id="lgErr"></div>
    </div>
    <div class="login-foot">Works offline · syncs to SharePoint when connected</div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <header class="top">
    <span class="logo">
      <span class="logo-mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14130A" stroke-width="2.6" stroke-linecap="round"><path d="M3 15.5c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0M3 9c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0"/></svg></span>
      <span class="ttl"><b>Beach Assets</b><em>CSULB Property Management</em></span>
    </span>
    <span class="grow"></span>
    <button class="btn btn-sm" id="cmdBtn" title="Quick actions (Ctrl/Cmd+K)" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#CFCDBE">⌘K</button>
    <button class="sync-chip" id="syncChip" title="Sync status — tap to sync now"><span class="dot"></span><span id="syncTxt">Sync off</span></button>
    <span class="user-pill"><span class="avatar" id="uAv">?</span><span class="uname" id="whoami"></span>
      <button class="btn btn-sm" id="logoutBtn" title="Sign out">Sign out</button>
    </span>
  </header>

  <div class="shell">
    <nav class="side" id="sideNav"></nav>
    <main id="main"></main>
  </div>
  <nav class="bottom" id="botNav"></nav>
</div>

<div id="overlay"></div>
<div id="toasts"></div>

<script>
/* ================================================================
   Beach Asset Management — CSULB Property Management Office
   Static app · GitHub Pages · SharePoint via Power Automate
   ================================================================ */
'use strict';
/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nowStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const STATUSES=['Verified OK','Not Found','Wrong Location','Damaged','Other'];
const stCls=s=>'st-'+String(s||'Unreviewed').replace(/\s/g,'');
const pill=s=>`<span class="stat-pill ${stCls(s)}">${esc(s||'Unreviewed')}</span>`;
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),3400)}
/* fun loading messages */
const QUIPS=['Counting the beans (and the carts)…','Dusting off the property tags…','Rounding up stray assets…','Herding barcodes…',
 'Asking the shore for its receipts…','Untangling the spreadsheet spaghetti…','Politely interrogating the database…','Checking under the couch cushions…',
 'Waking up the inventory gnomes…','Cross-referencing everything twice…','Sharpening pencils, digitally…','Convincing the assets to hold still…',
 'Sweeping sand off the ledger…','Doing the paperwork so you don’t have to…','Locating the unlocatable…','Reticulating asset splines…'];
const quip=()=>QUIPS[Math.floor(Math.random()*QUIPS.length)];
const loadingHTML=msg=>`<div class="load-quip"><span class="spin"></span> ${esc(msg||quip())}</div>`;
function modal(html){const v=document.createElement('div');v.className='modal-veil';v.innerHTML=`<div class="modal">${html}</div>`;
  v.addEventListener('click',e=>{if(e.target===v)v.remove()});document.body.append(v);return v}
function confirmDlg(title,body,okLabel,danger){return new Promise(res=>{
  const v=modal(`<h3>${esc(title)}</h3><div class="muted" style="font-size:14px;line-height:1.5">${body}</div>
    <div class="acts"><button class="btn" data-x>Cancel</button><button class="btn ${danger?'btn-danger':'btn-gold'}" data-ok>${esc(okLabel||'Confirm')}</button></div>`);
  v.querySelector('[data-x]').onclick=()=>{v.remove();res(false)};
  v.querySelector('[data-ok]').onclick=()=>{v.remove();res(true)};})}

/* ---------------- IndexedDB ---------------- */
let idb;
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('beachprop',2);
  r.onupgradeneeded=(e)=>{const d=r.result;
    if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
    if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});
    if(!d.objectStoreNames.contains('queue'))d.createObjectStore('queue',{keyPath:'qid',autoIncrement:true});
    if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
  r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(st,m)=>idb.transaction(st,m).objectStore(st);
const kvGet=k=>new Promise(r=>{const q=tx('kv').get(k);q.onsuccess=()=>r(q.result)});
const kvSet=(k,v)=>new Promise(r=>{const q=tx('kv','readwrite').put(v,k);q.onsuccess=()=>r()});
const dbAllAssets=()=>new Promise(r=>{const q=tx('assets').getAll();q.onsuccess=()=>r(q.result||[])});
const dbPutAsset=a=>new Promise(r=>{const q=tx('assets','readwrite').put(a);q.onsuccess=()=>r()});
function dbPutAssets(list){return new Promise(r=>{const t=idb.transaction('assets','readwrite'),s=t.objectStore('assets');list.forEach(a=>s.put(a));t.oncomplete=()=>r()})}
const dbClearAssets=()=>new Promise(r=>{const q=tx('assets','readwrite').clear();q.onsuccess=()=>r()});
const qAdd=op=>new Promise(r=>{const q=tx('queue','readwrite').add(op);q.onsuccess=()=>r(q.result)});
const qAll=()=>new Promise(r=>{const q=tx('queue').getAll();q.onsuccess=()=>r(q.result||[])});
const qPut=op=>new Promise(r=>{const q=tx('queue','readwrite').put(op);q.onsuccess=()=>r()});
const qDel=id=>new Promise(r=>{const q=tx('queue','readwrite').delete(id);q.onsuccess=()=>r()});
const qClear=()=>new Promise(r=>{const q=tx('queue','readwrite').clear();q.onsuccess=()=>r()});
const phGet=id=>new Promise(r=>{const q=tx('photos').get(id);q.onsuccess=()=>r(q.result)});
const phPut=(id,dataUrl)=>new Promise(r=>{const q=tx('photos','readwrite').put(dataUrl,id);q.onsuccess=()=>r()});
const phDel=id=>new Promise(r=>{const q=tx('photos','readwrite').delete(id);q.onsuccess=()=>r()});
const phAllKeys=()=>new Promise(r=>{const q=tx('photos').getAllKeys();q.onsuccess=()=>r(q.result||[])});
const phAll=()=>new Promise(r=>{const q=tx('photos').getAll();q.onsuccess=()=>r(q.result||[])});

/* ---------------- crypto ---------------- */
const buf2hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const hex2buf=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
const randSalt=()=>buf2hex(crypto.getRandomValues(new Uint8Array(16)));
async function pbkdf2(pw,saltHex){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex2buf(saltHex),iterations:200000,hash:'SHA-256'},key,256);
  return buf2hex(bits)}

/* ---------------- boot ---------------- */
async function boot(){
  document.body.classList.toggle('is-mobile',matchMedia('(max-width:899px)').matches);
  await dbOpen();
  ST.theme=await kvGet('theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=ST.theme;
  ST.cfg=Object.assign(ST.cfg,await kvGet('cfg')||{});
  // one-time setup link (#setup=BASE64) — apply shared sync/AI settings, then clean the hash
  if(location.hash.startsWith('#setup=')){
    try{
      const inc=JSON.parse(atob(decodeURIComponent(location.hash.slice(7))));
      for(const k of ['getUrl','postUrl','key','dsKey'])if(String(inc[k]||'').length)ST.cfg[k]=String(inc[k]);
      await kvSet('cfg',ST.cfg);
      history.replaceState(null,'',location.pathname+location.search);
      toast('Shared settings applied — this device is set up');
    }catch(e){console.warn('bad setup link',e)}
  }
  // optional repo-committed seed/config.json — fills in any blank settings so
  // new devices sync out of the box (see the example file in seed/)
  try{
    const fc=await fetch('seed/config.json').then(r=>r.ok?r.json():null).catch(()=>null);
    if(fc){let ch=false;
      for(const k of ['getUrl','postUrl','key','dsKey'])if(!ST.cfg[k]&&String(fc[k]||'').length){ST.cfg[k]=String(fc[k]);ch=true}
      if(ch){await kvSet('cfg',ST.cfg);toast('Sync settings loaded from the deployed config')}
    }
  }catch(e){}
  ST.users=await kvGet('users')||[];
  ST.lastSync=await kvGet('lastSync')||'';
  ST.syncLog=await kvGet('syncLog')||[];
  let assets=await dbAllAssets();
  ST.depts=await kvGet('depts')||[];
  if(!assets.length){
    try{
      const [a,d]=await Promise.all([fetch('seed/assets.json').then(r=>r.json()),fetch('seed/departments.json').then(r=>r.json())]);
      await dbPutAssets(a);await kvSet('depts',d);assets=a;ST.depts=d;
      toast(`Loaded ${a.length.toLocaleString()} seed assets`);
    }catch(e){console.warn('seed load failed',e)}
  }
  assets.forEach(a=>{if(!a.lc)a.lc='A';if(!a.survey)a.survey=[];ST.assets.set(a.id,a)});
  if(![...ST.assets.values()].some(a=>a.lc==='D')){
    try{
      const disp=await fetch('seed/disposed.json').then(r=>r.json());
      const add=disp.filter(d=>!ST.assets.has(d.id));
      add.forEach(a=>ST.assets.set(a.id,a));await dbPutAssets(add);
      toast(`Loaded ${add.length.toLocaleString()} disposed/retired assets`);
    }catch(e){console.warn('disposed seed load failed',e)}
  }
  if(!ST.users.length){
    try{ST.users=await fetch('seed/users.json').then(r=>r.json());await kvSet('users',ST.users)}
    catch(e){console.warn('users seed load failed',e)}
  }
  ST.depts.forEach(d=>ST.deptMap[d.deptId]=d);
  SURV_EDITS=await kvGet('survEdits')||{};
  ST.tracker=await kvGet('trackerProgress')||null;
  PAY_ROWS=await kvGet('auctionPayRows')||[];buildPaymentIndex();
  await loadSurveys();
  ST.pending=(await qAll()).filter(o=>!o.done).length;
  ST.photoIds=new Set(await phAllKeys());
  if(!window.crypto||!crypto.subtle){
    $('#lgErr').textContent='Secure sign-in needs HTTPS (or localhost). Open the GitHub Pages URL.';
    $('#lgGo').disabled=true;
  }
  const sess=await kvGet('session');
  if(!ST.users.length)$('#lgErr').textContent='Could not load accounts — check that seed/users.json deployed with the app.';
  if(sess&&sess.exp>Date.now()&&(ST.users.find(u=>u.username===sess.u)||sess.local)){ST.session=sess;enterApp()}
}
async function doLogin(){
  const un=$('#lgU').value.trim().toLowerCase(),pw=$('#lgP').value;
  const u=ST.users.find(x=>x.username.toLowerCase()===un&&String(x.active).toLowerCase()!=='no'&&String(x.active).toLowerCase()!=='false');
  $('#lgErr').textContent='';
  if(!u){$('#lgErr').textContent='Unknown or inactive username.';return}
  $('#lgGo').disabled=true;$('#lgGo').innerHTML='<span class="spin"></span>';
  try{
    const h=await pbkdf2(pw,u.salt);
    if(h!==u.hash){$('#lgErr').textContent='Wrong password.';return}
    ST.session={u:u.username,name:u.display||u.username,role:u.role||'auditor',exp:Date.now()+12*3600*1000,local:!!u.local};
    await kvSet('session',ST.session);enterApp();
  }finally{$('#lgGo').disabled=false;$('#lgGo').textContent='Sign in'}
}

/* ---------------- save + queue ---------------- */
function spShape(a){return{id:a.id,tag:a.tag,dept:a.dept,deptName:a.deptName,div:a.div,desc:a.desc,serial:a.serial,
  location:a.location,custodian:a.custodian,category:a.category,acqDate:a.acqDate,inServiceDt:a.inServiceDt,po:a.po,
  value:a.value,status:a.status,notes:a.notes,updatedBy:a.updatedBy,updatedAt:a.updatedAt,history:JSON.stringify(a.history||[])}}
async function saveAsset(a,changes,silent,by){
  a.updatedAt=nowStr();a.updatedBy=by||(ST.session?ST.session.name:'?');
  (changes||[]).forEach(c=>{(a.history=a.history||[]).push({f:c.f,old:c.old,new:c.new,t:a.updatedAt,u:a.updatedBy})});
  ST.assets.set(a.id,a);await dbPutAsset(a);
  if(a.lc==='D'){syncChip();return} // disposal records are local reference data — not synced
  const ops=await qAll();
  const ex=ops.find(o=>!o.done&&o.kind==='upsert'&&o.payload.id===a.id);
  if(ex){ex.payload=spShape(a);await qPut(ex)}else{await qAdd({kind:'upsert',payload:spShape(a),t:nowStr()})}
  for(const c of (changes||[])){
    await qAdd({kind:'audit',payload:{AssetID:a.id,Field:c.f,OldValue:String(c.old??''),NewValue:String(c.new??''),
      Status:a.status,Timestamp:a.updatedAt,User:a.updatedBy},t:nowStr()});
  }
  ST.pending=(await qAll()).filter(o=>!o.done).length;
  syncChip();if(!silent)scheduleAutoSync();
}
let autoT;function scheduleAutoSync(){clearTimeout(autoT);if(ST.cfg.postUrl)autoT=setTimeout(()=>syncNow(true),4000)}

/* ---------------- sync engine ---------------- */
function syncChip(){
  const c=$('#syncChip'),t=$('#syncTxt');if(!c)return;
  c.className='sync-chip';
  if(ST.busy){c.classList.add('busy');t.textContent='Syncing…'}
  else if(!ST.cfg.postUrl){t.textContent='Sync off'}
  else if(ST.pending>0){c.classList.add('pend');t.textContent=ST.pending+' pending'}
  else{c.classList.add('ok');t.textContent=ST.lastSync?('Synced '+ST.lastSync.slice(5)):'Synced'}
}
async function logSync(entry){ST.syncLog.unshift({t:nowStr(),...entry});ST.syncLog=ST.syncLog.slice(0,30);await kvSet('syncLog',ST.syncLog)}
async function syncNow(silentOk){
  if(!ST.cfg.postUrl){location.hash='#/settings';toast('Set up sync in Settings first',1);return}
  if(ST.busy)return;ST.busy=true;syncChip();
  try{
    const ops=(await qAll()).filter(o=>!o.done);
    // locally-added accounts ride along on the first batch until SharePoint confirms them
    const localUsers=ST.users.filter(u=>u.local).map(u=>({username:u.username,display:u.display||u.username,
      role:u.role||'auditor',salt:u.salt,hash:u.hash,active:u.active??'Yes'}));
    if(ops.length||localUsers.length){
      for(let i=0;i<Math.max(ops.length,1);i+=300){
        const batch=ops.slice(i,i+300);
        const body={key:ST.cfg.key,user:ST.session?ST.session.name:'?',
          assetUpserts:batch.filter(o=>o.kind==='upsert').map(o=>o.payload),
          auditLog:batch.filter(o=>o.kind==='audit').map(o=>o.payload),
          importLog:batch.filter(o=>o.kind==='import').map(o=>o.payload),
          userUpserts:i===0?localUsers:[]};
        const r=await fetch(ST.cfg.postUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
        if(!r.ok)throw new Error('Write endpoint returned '+r.status);
        let j={};try{j=await r.json()}catch(e){}
        if(j.ok===false)throw new Error(j.error||'Flow reported failure');
        for(const o of batch){await qDel(o.qid)}
        if(i===0&&localUsers.length){
          if(typeof j.usersProcessed==='number'&&j.usersProcessed>0){
            ST.users.forEach(u=>{if(u.local)delete u.local});await kvSet('users',ST.users);
            await logSync({ok:true,msg:`Pushed ${localUsers.length} user account(s) to the SharePoint Users list`});
          }else{
            await logSync({ok:false,msg:`Write flow ignored ${localUsers.length} pending user account(s) — add the userUpserts step to the update flow (README §3) or paste the row into the Users list by hand`});
          }
        }
        if(batch.length)await logSync({ok:true,msg:`Pushed ${batch.filter(o=>o.kind==='upsert').length} assets, ${batch.filter(o=>o.kind==='audit').length} audit rows`});
      }
    }
    ST.pending=0;
    if(ST.cfg.getUrl)await pullData();
    ST.lastSync=nowStr();await kvSet('lastSync',ST.lastSync);
    if(!silentOk)toast('Sync complete — all changes confirmed');
  }catch(e){
    await logSync({ok:false,msg:String(e.message||e)});
    toast('Sync failed: '+(e.message||e),1);
  }finally{
    ST.busy=false;ST.pending=(await qAll()).filter(o=>!o.done).length;syncChip();
  }
}
async function pullData(){
  const url=ST.cfg.getUrl+(ST.cfg.getUrl.includes('?')?'&':'?')+'k='+encodeURIComponent(ST.cfg.key);
  const r=await fetch(url);if(!r.ok)throw new Error('Read endpoint returned '+r.status);
  const j=await r.json();if(!j||j.ok===false)throw new Error('Read endpoint rejected the key');
  const pendingIds=new Set((await qAll()).filter(o=>!o.done&&o.kind==='upsert').map(o=>o.payload.id));
  let merged=0;
  if(Array.isArray(j.assets)){
    const put=[];
    for(const raw of j.assets){
      const id=String(raw.id??'').trim();if(!id||pendingIds.has(id))continue;
      let hist=[];try{hist=typeof raw.history==='string'?JSON.parse(raw.history||'[]'):(raw.history||[])}catch(e){}
      const old=ST.assets.get(id);
      put.push({id,tag:raw.tag??'',dept:String(raw.dept??''),deptName:raw.deptName??'',div:raw.div??'',desc:raw.desc??'',
        serial:raw.serial??'',location:raw.location??'',custodian:raw.custodian??'',category:raw.category??'',
        acqDate:raw.acqDate??'',inServiceDt:raw.inServiceDt??'',po:raw.po??'',value:Number(raw.value)||0,
        status:raw.status||'Unreviewed',notes:raw.notes??'',updatedBy:raw.updatedBy??'',updatedAt:raw.updatedAt??'',history:hist,
        lc:'A',survey:old?.survey||[],retireDate:'',netBook:0});
    }
    put.forEach(a=>ST.assets.set(a.id,a));await dbPutAssets(put);merged=put.length;
  }
  if(Array.isArray(j.departments)&&j.departments.length){
    ST.depts=j.departments.map((d,i)=>({deptId:String(d.deptId??''),name:d.name??'',div:d.div??'',sortOrder:Number(d.sortOrder)||i+1,completed:!!d.completed}));
    ST.deptMap={};ST.depts.forEach(d=>ST.deptMap[d.deptId]=d);await kvSet('depts',ST.depts);
  }
  if(Array.isArray(j.users)&&j.users.length){
    const locals=ST.users.filter(u=>u.local&&!j.users.some(s=>s.username===u.username));
    ST.users=j.users.map(u=>({username:u.username,display:u.display||u.username,role:u.role||'auditor',salt:u.salt,hash:u.hash,active:u.active??'Yes'})).concat(locals);
    await kvSet('users',ST.users);
  }
  if(Array.isArray(j.surveys)){
    const keep=ST.archiveLoaded?ST.surveys.filter(s=>s.ar):[];
    ST.surveys=j.surveys.concat(keep);buildSurveyIndex();
  }
  await logSync({ok:true,msg:`Pulled ${merged} assets from SharePoint`});
  if(typeof render==='function')render();
}
async function nukeAndReseed(){
  await dbClearAssets();await qClear();ST.assets.clear();ST.sel.clear();
  const bust='?_='+Date.now();
  const [a,d]=await Promise.all([fetch('seed/assets.json'+bust).then(r=>r.json()),fetch('seed/departments.json'+bust).then(r=>r.json())]);
  await dbPutAssets(a);await kvSet('depts',d);
  a.forEach(x=>{if(!x.lc)x.lc='A';if(!x.survey)x.survey=[];ST.assets.set(x.id,x)});
  ST.depts=d;ST.deptMap={};ST.depts.forEach(x=>ST.deptMap[x.deptId]=x);
  let dispN=0;
  try{const disp=await fetch('seed/disposed.json'+bust).then(r=>r.json());
    disp.forEach(x=>ST.assets.set(x.id,x));await dbPutAssets(disp);dispN=disp.length;
  }catch(e){console.warn('disposed reseed failed',e)}
  ST.pending=0;ST.lastSync='';await kvSet('lastSync','');
  await logSync({ok:true,msg:`Nuked local data — reseeded ${a.length.toLocaleString()} active + ${dispN.toLocaleString()} disposed from fresh exports`});
  let pulled=false;
  if(ST.cfg.getUrl){try{await pullData();pulled=true}catch(e){console.warn('post-nuke pull failed',e)}}
  return{active:a.length,disposed:dispN,pulled};
}
async function promptNuke(){
  const pendingWarn=ST.pending>0?`<br><br><b style="color:var(--bad)">⚠ You have ${ST.pending} unsynced change(s) on this device — they will be permanently lost.</b> Sync now first if you want to keep them.`:'';
  if(!await confirmDlg('Nuke & rebuild data',
    `This erases every local asset and department record and the pending sync queue on <b>this device only</b>, then reloads fresh from the bundled seed exports${ST.cfg.getUrl?' and immediately re-pulls the latest from SharePoint':''}. Your sign-in and sync settings are kept. SharePoint itself is not touched.${pendingWarn}`,
    'Nuke & rebuild',true))return;
  ST.busy=true;syncChip();toast(quip());
  try{
    const r=await nukeAndReseed();
    toast(`Rebuilt — ${r.active.toLocaleString()} active + ${r.disposed.toLocaleString()} disposed loaded${r.pulled?' · synced with SharePoint':''}`);
  }catch(e){toast('Rebuild failed: '+(e.message||e),1)}
  finally{ST.busy=false;syncChip();render()}
}

    if(j&&j.ok!==false)toast('Connection OK — read endpoint reachable');else toast('Endpoint reachable but rejected the key',1);
  }catch(e){toast('Connection failed: '+(e.message||e),1)}
}

function deptLabel(id){const d=ST.deptMap[id];return d&&d.name?d.name:('Dept '+id)}
function deptPad(id){return String(id).padStart(5,'0')}
const srvBadge=a=>(a.survey&&a.survey.length)?`<span class="srv-badge" title="Survey record(s) on file">⚑ Survey ×${a.survey.length}</span>`:'';
const photoBadge=a=>ST.photoIds.has(a.id)?`<span class="srv-badge" style="background:var(--surface2);color:var(--ink2);border-color:var(--line2)" title="Photo attached (this device)">📷</span>`:'';
function downscaleImage(file,maxDim=1280,quality=.72){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){const s=maxDim/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read image'))};
    img.src=url;
  });
}
function assetCard(a,opts={}){

/* ---------------- search ---------------- */
const SCOPES=[['all','All fields'],['tag','Tag'],['id','Asset ID'],['serial','Serial'],['location','Location'],['custodian','Custodian'],['dept','Department']];
function searchAssets(q,scope){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return[];
  const hay=a=>{switch(scope){case'tag':return a.tag;case'id':return a.id;case'serial':return a.serial;case'location':return a.location;
    case'custodian':return a.custodian;case'dept':return a.dept+' '+a.deptName+' '+deptLabel(a.dept);
    default:return [a.tag,a.id,a.serial,a.desc,a.location,a.custodian,a.dept,a.deptName,deptLabel(a.dept),a.div,a.notes,a.retireDate].join(' ')}};
  const out=[];
  for(const a of ST.assets.values()){
    if(!lcPass(a))continue;
    const h=hay(a).toLowerCase();
    if(toks.every(t=>h.includes(t)))out.push(a);
  }
  const q0=toks[0];
  out.sort((x,y)=>{const xs=x.tag.toLowerCase().startsWith(q0)?0:1,ys=y.tag.toLowerCase().startsWith(q0)?0:1;
    return xs-ys||(x.lc==='D')-(y.lc==='D')||x.tag.localeCompare(y.tag)});
  return out;
}
function renderSearch(m){
  const nA=[...ST.assets.values()].filter(a=>a.lc!=='D').length,nD=ST.assets.size-nA;
  m.innerHTML=`<div class="page-h"><h2>Asset lookup</h2><span class="cnt">${nA.toLocaleString()} active · ${nD.toLocaleString()} disposed</span></div>
  <div class="search-wrap"><span class="s-ico">${I.search}</span>
    <input id="gq" type="search" placeholder="Tag, serial, description, location, custodian…" value="${esc(ST.q)}" autocomplete="off">
    <button class="s-clear ${ST.q?'':'hidden'}" id="gqClear">✕</button></div>
  <div class="chip-row" style="align-items:center">${lcSeg()}<span style="width:4px"></span>${SCOPES.map(([k,l])=>`<button class="chip ${ST.scope===k?'on':''}" data-scope="${k}">${l}</button>`).join('')}
    <button class="chip" id="gqScan" style="margin-left:auto" title="Scan a tag / QR code">📷 Scan</button></div>
  <div id="sres"></div>`;
  const run=()=>{
    ST.q=$('#gq').value;$('#gqClear').classList.toggle('hidden',!ST.q);
    const box=$('#sres');
    if(ST.q.trim().length<2){box.innerHTML=`<div class="note">Type at least 2 characters — searching ${ST.lc==='A'?'active assets':ST.lc==='D'?'disposed/retired assets':'all assets, active and disposed'}. Tip: scan-read a property tag and type the last 4–5 digits.</div>`;return}
    const res=searchAssets(ST.q,ST.scope),max=80;
    box.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:9px">${res.length.toLocaleString()} match${res.length===1?'':'es'}${res.length>max?' · showing first '+max:''}</div>`
      +res.slice(0,max).map(a=>assetCard(a)).join('');
  };
  $('#gq').addEventListener('input',debounce(run,160));
  $('#gq').addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const q=$('#gq').value.trim();if(q.length<2)return;
    const res=searchAssets(q,ST.scope);
    // exactly one hit, or an exact tag/id match — open it (fast path for scanned tags)
    const exact=res.filter(a=>a.tag.toLowerCase()===q.toLowerCase()||a.id===q.replace(/^0+/,''));
    const hit=res.length===1?res[0]:(exact.length===1?exact[0]:null);
    if(hit)openAsset(hit.id);
  });
  $('#gqClear').onclick=()=>{$('#gq').value='';run();$('#gq').focus()};
  $('#gqScan').onclick=()=>openScanner();
  m.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{ST.scope=b.dataset.scope;renderSearch(m);$('#gq').focus()});
  bindListEvents($('#sres'));
  if(!document.body.classList.contains('is-mobile'))$('#gq').focus();
  run();
}

/* ---------------- virtual table ---------------- */
const COLS=[
 {k:'tag',l:'Tag',w:104,cls:'mono'},
 {k:'id',l:'Asset ID',w:84,cls:'mono num'},
 {k:'desc',l:'Description',w:280},
 {k:'serial',l:'Serial',w:150,cls:'mono'},
 {k:'dept',l:'Dept',w:70,cls:'mono num'},
 {k:'deptName',l:'Department name',w:190},
 {k:'div',l:'Div/Org',w:96,cls:'mono'},
 {k:'location',l:'Location',w:120},
 {k:'custodian',l:'Custodian',w:160},
 {k:'acqDate',l:'Acq date',w:100,date:1},
 {k:'inServiceDt',l:'In service',w:100,date:1},
 {k:'value',l:'Value',w:110,cls:'num',num:1,fmt:v=>fmt$(v)},
 {k:'status',l:'Status',w:130,fmt:v=>pill(v)},
 {k:'retireDate',l:'Retired',w:100,cls:'mono',date:1},
 {k:'notes',l:'Notes',w:200},
 {k:'updatedAt',l:'Last updated',w:130,cls:'mono'},
 {k:'updatedBy',l:'Updated by',w:120}];
function cmp(a,b,c){
  let x=a[c.k],y=b[c.k];
  if(c.num){x=Number(x)||0;y=Number(y)||0;return x-y}
  if(c.date){x=x?new Date(x).getTime()||0:0;y=y?new Date(y).getTime()||0:0;return x-y}
  if(c.k==='id'||c.k==='dept')return (Number(x)||0)-(Number(y)||0);
  return String(x??'').localeCompare(String(y??''))}
function vTable(box,rows,opts={}){
  const cols=opts.compact?COLS.filter(c=>['tag','desc','serial','location','custodian','value','status','notes'].includes(c.k)):COLS;
  const sorted=[...rows].sort((a,b)=>cmp(a,b,COLS.find(c=>c.k===ST.sort.k)||COLS[0])*ST.sort.dir);
  const grid=`42px ${cols.map(c=>c.w+'px').join(' ')}`;
  const rowH=44; // must match --rowH in the stylesheet
  box.innerHTML=`<div class="vt"><div class="vt-scroll" id="vsc">
    <div class="vt-head" style="grid-template-columns:${grid}">
      <div class="c ck-c"><input type="checkbox" id="vAll" title="Select all shown"></div>
      ${cols.map(c=>`<div class="c ${ST.sort.k===c.k?'sorted':''}" data-sort="${c.k}">${c.l}${ST.sort.k===c.k?(ST.sort.dir>0?' ▲':' ▼'):''}</div>`).join('')}
    </div>
    <div class="vt-body" id="vbody" style="height:${sorted.length*rowH}px"></div>
  </div>
  <div style="padding:8px 12px;font-size:12.5px" class="muted">${sorted.length.toLocaleString()} rows · click a column to sort · click a row to open · disposed rows are read-only</div></div>`;
  const sc=$('#vsc'),body=$('#vbody');
  function paint(){
    const top=sc.scrollTop,first=Math.max(0,Math.floor(top/rowH)-6),last=Math.min(sorted.length,first+Math.ceil(sc.clientHeight/rowH)+12);
    let h='';
    for(let i=first;i<last;i++){const a=sorted[i];
      h+=`<div class="vt-row ${ST.sel.has(a.id)?'sel':''}" data-open="${esc(a.id)}" style="top:${i*rowH}px;grid-template-columns:${grid}">
        <div class="c ck-c">${a.lc==='D'?'':`<input type="checkbox" data-ck="${esc(a.id)}" ${ST.sel.has(a.id)?'checked':''}>`}</div>
        ${cols.map(c=>`<div class="c ${c.cls||''}" title="${esc(a[c.k])}">${c.k==='status'?pill(a.lc==='D'?'Disposed':a.status):(c.fmt?c.fmt(a[c.k]):esc(a[c.k]))}</div>`).join('')}</div>`;
    }
    body.innerHTML=h;
  }
  sc.addEventListener('scroll',()=>requestAnimationFrame(paint));paint();

/* ---------------- dashboard charts ---------------- */
function svgDonut(data,opts={}){
  const size=opts.size||128,stroke=opts.stroke||17,r=(size-stroke)/2,c=2*Math.PI*r;
  const total=data.reduce((s,d)=>s+d.n,0)||1;
  let offset=0;
  const rings=data.filter(d=>d.n>0).map(d=>{
    const frac=d.n/total,len=frac*c;
    const seg=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${stroke}"
      stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(d.label)}: ${d.n}</title></circle>`;
    offset+=len;return seg;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--un-bg)" stroke-width="${stroke}"/>${rings}</svg>`;
}
function divCompletion(){
  const byDiv={};
  ST.depts.forEach(d=>{const s=deptStats(d.deptId);const b=byDiv[d.div]=byDiv[d.div]||{t:0,r:0};b.t+=s.t;b.r+=s.r});
  return Object.entries(byDiv).map(([div,s])=>({div,pct:s.t?Math.round(100*s.r/s.t):0,...s}))
    .sort((a,b)=>b.pct-a.pct||a.div.localeCompare(b.div));
}

/* ---------------- autofill suggestions ---------------- */
function buildSuggIndex(field,deptId){
  const all=new Map(),mine=new Map();
  for(const a of ST.assets.values()){
    if(a.lc==='D')continue;
    const v=String(a[field]||'').trim();if(!v)continue;
    all.set(v,(all.get(v)||0)+1);
    if(a.dept===deptId)mine.set(v,(mine.get(v)||0)+1);
  }
  return{all,mine};
}
function attachSuggest(input,field,deptId){
  const idx=buildSuggIndex(field,deptId);
  const wrap=document.createElement('div');wrap.className='sugg-wrap';
  input.parentNode.insertBefore(wrap,input);wrap.append(input);
  let box=null;
  const close=()=>{if(box){box.remove();box=null}};
  const show=()=>{
    const q=input.value.trim().toLowerCase();
    const score=(v,n,own)=>{const lv=v.toLowerCase();
      if(q&&!lv.includes(q))return -1;
      return (own?10000:0)+(q&&lv.startsWith(q)?1000:0)+n};
    const cand=new Map();
    idx.mine.forEach((n,v)=>{const s=score(v,n,1);if(s>=0)cand.set(v,{s,n})});
    idx.all.forEach((n,v)=>{if(!cand.has(v)){const s=score(v,n,0);if(s>=0)cand.set(v,{s,n})}});
    const top=[...cand.entries()].sort((a,b)=>b[1].s-a[1].s).slice(0,8)
      .filter(([v])=>v.toLowerCase()!==q);
    close();
    if(!top.length)return;
    box=document.createElement('div');box.className='sugg';
    box.innerHTML=top.map(([v,{n}])=>`<button type="button" data-v="${esc(v)}"><span>${esc(v)}</span><span class="freq">${idx.mine.has(v)?'this dept · ':''}×${n}</span></button>`).join('');
    box.addEventListener('mousedown',e=>{const b=e.target.closest('[data-v]');
      if(b){e.preventDefault();input.value=b.dataset.v;close();input.dispatchEvent(new Event('input'))}});
    wrap.append(box);
  };
  input.addEventListener('input',debounce(show,120));
  input.addEventListener('focus',show);
  input.addEventListener('blur',()=>setTimeout(close,180));
}

const IMP_MAP={'asset id':'id','tag number':'tag','tag #':'tag','tag':'tag','property tag':'tag',
 'dept':'dept','dept id':'dept','department':'dept','cust dept':'dept','custodian dept id':'dept','department descr':'deptName','department name':'deptName',
 'description':'desc','serial id':'serial','serial#':'serial','serial':'serial','original serial':null,
 'location':'location','custodian':'custodian','category':'category','profile id':'category',
 'acq date':'acqDate','in service dt':'inServiceDt','in service date':'inServiceDt',
 'po no.':'po','po no':'po','sum amount':'value','amount':'value','value':'value','original asset amount':'value',
 'status':'status','notes':'notes','pmo comments':'pmo','retire date':'retireDate','net book value':'netBook'};
const impKey=k=>IMP_MAP[String(k||'').replace(/\s+/g,' ').trim().toLowerCase()];
function pmoToStatus(c){
  // PMO worksheet comments -> audit status + note
  const t=String(c||'').trim();if(!t)return{};
  if(/lost|missing/i.test(t))return{status:'Not Found',note:t};
  if(/not\s*verified/i.test(t))return{note:t};               // leave status unchanged
  if(/^ok\b/i.test(t)||/photo of tag/i.test(t))return{status:'Verified OK',note:t.replace(/^ok$/i,'')};
  return{status:'Other',note:t};
}
function findHeaderRow(aoa){
  for(let i=0;i<Math.min(aoa.length,12);i++){
    const cells=(aoa[i]||[]).map(c=>String(c??'').replace(/\s+/g,' ').trim().toLowerCase());
    if(cells.some(c=>c==='asset id')||(cells.includes('tag #')&&cells.includes('description'))||(cells.includes('tag number')&&cells.includes('retire date')))
      return i;
  }
  return -1;
}
function aoaToObjects(aoa,hi){
  const hdr=aoa[hi].map(c=>String(c??'').replace(/\s+/g,' ').trim());
  return aoa.slice(hi+1).map(row=>{const o={};hdr.forEach((h,j)=>{if(h)o[h]=row[j]});return o});
}
function normalizeRows(rows){
  const byId=new Map();let skipped=0;
  const clean=v=>{const s=String(v??'').trim();return /^(nan|nat|none|null)$/i.test(s)?'':s};
  const dstr=v=>{const s=clean(v);const m=s.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:s};
  for(const r of rows){
    const o={};
    for(const k in r){const mk=impKey(k);if(mk)o[mk]=r[k]}
    let id=clean(o.id).replace(/\.0$/,'');
    if(!/^\d+$/.test(id)){skipped++;continue}
    id=String(parseInt(id,10)); // strip leading zeros: 000000001809 -> 1809
    const val=parseFloat(String(o.value??'0').replace(/[$,]/g,''))||0;
    if(byId.has(id)){byId.get(id).value+=val;continue}
    const pmo=pmoToStatus(o.pmo);
    byId.set(id,{id,tag:clean(o.tag),dept:String(parseInt(o.dept)||'').trim(),deptName:clean(o.deptName),
      desc:clean(o.desc),serial:clean(o.serial),location:clean(o.location),custodian:clean(o.custodian),
      category:clean(o.category),acqDate:dstr(o.acqDate),inServiceDt:dstr(o.inServiceDt),
      po:clean(o.po).replace(/\.0$/,''),value:val,
      status:clean(o.status)||pmo.status||'',noteAdd:pmo.note||'',notes:clean(o.notes),
      retireDate:dstr(o.retireDate),netBook:parseFloat(String(o.netBook??'0').replace(/[$,]/g,''))||0,
      isDisposal:'retireDate' in o});
  }
  return{rows:[...byId.values()],skipped};
}
const CMP_FIELDS=['tag','dept','desc','serial','location','custodian','category','acqDate','inServiceDt','po','value','status'];
const fieldAudited=(ex,f)=>(ex.history||[]).some(h=>h.f===f&&h.u!=='Tracker Import'&&!String(h.u).startsWith('Import'));
function diffImport(incoming){
  const news=[],updates=[],conflicts=[],unchanged=[];
  for(const r of incoming){
    const ex=ST.assets.get(r.id);
    if(!ex){news.push(r);continue}
    const ch=[],cf=[];
    for(const f of CMP_FIELDS){
      if(!String(r[f]??'').length)continue; // sparse files never blank fields
      const nv=f==='value'?Number(r[f])||0:String(r[f]),ov=f==='value'?Number(ex[f])||0:String(ex[f]??'');
      if(String(nv)!==String(ov)){
        (fieldAudited(ex,f)?cf:ch).push({f,old:ov,new:nv});
      }
    }
    if(r.noteAdd&&!(ex.notes||'').includes(r.noteAdd)){
      ch.push({f:'notes',old:ex.notes,new:ex.notes?ex.notes+'; '+r.noteAdd:r.noteAdd});
    }
    if(cf.length)conflicts.push({asset:ex,ch,cf});
    else if(ch.length)updates.push({asset:ex,ch});
    else unchanged.push(ex);
  }
  return{news,updates,conflicts,unchanged};
}

const SURVCAT={NEW:'New Survey App',BK:'Bookstore E-Waste',CI:'Campus Inventory',CNI:'Campus Non-Inventory',TR:'Transfer',FDN:'Foundation'};
const SURVCATSHORT={NEW:'New',BK:'Bookstore',CI:'Inventory',CNI:'Non-Inv',TR:'Transfer',FDN:'Foundation'};
/* disposal-action buckets — the raw data spells actions many ways (EWASTE/E-WASTE, REYCLE, REUTILAZATION…) */
const ACT_BUCKETS=[['ewaste','E-Waste',/e-?waste/i],['recycle','Recycle',/recycl|reycle/i],['auction','Auction',/auction/i],
 ['donation','Donation',/donat/i],['transfer','Transfer',/transfer/i],['reuse','Reutilization',/re-?ut/i],
 ['lost','Lost/Stolen',/lost|missing|stolen/i],['cancel','Cancelled',/cancel/i]];
const actBucket=a=>{const t=String(a||'');if(!t)return'';for(const[k,,re]of ACT_BUCKETS)if(re.test(t))return k;return'other'};
function survKey(s){return [s.cat,s.no||'(no #)',s.fy||''].join('')}
function survDeptId(s){return s.dp||s.fd||''}
function survDeptName(s){return s.dn||s.fdn||(s.td?('→ '+(s.tdn||s.td)):'')||''}
const _digits=x=>String(x==null?'':x).replace(/\D/g,'').replace(/^0+/,'');
const _alnum=x=>String(x==null?'':x).toUpperCase().replace(/[^A-Z0-9]/g,'');
const _idn=x=>{x=String(x==null?'':x).trim();return x.replace(/^0+/,'')||x};
/* check-in edits: per-line-item overrides + checked-in flag, keyed by the item's
   unique k, stored in kv 'survEdits' (device-local — survives Nuke & rebuild) */
let SURV_EDITS={};
function applySurvEdits(){
  for(const s of ST.surveys){
    const o=SURV_EDITS[s.k];if(!o)continue;
    s.chk=o.ok?1:0;
    if(o.d!=null)s.d=o.d;if(o.ser!=null)s.ser=o.ser;if(o.nt!=null)s.nt=o.nt;
  }
}
async function saveSurvEdit(s,patch){
  const o=SURV_EDITS[s.k]={...SURV_EDITS[s.k],...patch,by:ST.session?ST.session.name:'?',at:nowStr()};
  s.chk=o.ok?1:0;
  if(o.d!=null)s.d=o.d;if(o.ser!=null)s.ser=o.ser;if(o.nt!=null)s.nt=o.nt;
  await kvSet('survEdits',SURV_EDITS);
}
function buildSurveyIndex(){
  applySurvEdits();
  const byId=new Map(),byTag=new Map(),bySer=new Map();
  for(const a of ST.assets.values()){
    const i=_idn(a.id);if(i&&!byId.has(i))byId.set(i,a.id);
    const t=_digits(a.tag);if(t.length>=3&&!byTag.has(t))byTag.set(t,a.id);
    const se=_alnum(a.serial);if(se.length>=5&&!bySer.has(se))bySer.set(se,a.id);
  }
  ST.surveyByAsset=new Map();ST.surveyGroups=new Map();
  for(const s of ST.surveys){
    let m='',mt='';
    const i=_idn(s.aid);if(i&&byId.has(i)){m=byId.get(i);mt='id'}
    if(!m){const t=_digits(s.tag);if(t.length>=3&&byTag.has(t)){m=byTag.get(t);mt='tag'}}
    if(!m){const se=_alnum(s.ser);if(se.length>=5&&bySer.has(se)){m=bySer.get(se);mt='serial'}}
    s.m=m||undefined;s.mt=mt||undefined;
    if(!s.st)s.st=(!s.ar&&!s.dc)?'Open':'Done';
    if(m){let arr=ST.surveyByAsset.get(m);if(!arr){arr=[];ST.surveyByAsset.set(m,arr)}arr.push(s)}
    const k=survKey(s);let g=ST.surveyGroups.get(k);
    if(!g){g={key:k,cat:s.cat,no:s.no||'',fy:s.fy||'',ar:s.ar,items:[]};ST.surveyGroups.set(k,g)}
    g.items.push(s);
  }
}

function surveyMeta(g){
  if(g._meta)return g._meta;
  let date='',dept='',desc='',linked=0,open=false;const acts=new Set(),bks=new Set();

/* ---------------- auction payments (Public Surplus "Payment Collection Report") ----------------
   Device-local reference data. Matched to surveys by survey # (report column F, "Item Code/Tag").
   Raw line rows stored in kv 'auctionPayRows'; aggregated per survey # into ST.auctionPay. */
let PAY_ROWS=[];
const payNorm=x=>String(x==null?'':x).toUpperCase().replace(/[^A-Z0-9]/g,'');
const payNum=x=>{const n=parseFloat(String(x==null?'':x).replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0};
const payMoney=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const PAY_MON={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
function payDate(s){s=String(s==null?'':s).trim();
  const m=s.match(/([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s*(\d{4})/);
  if(m&&PAY_MON[m[1].toLowerCase()])return `${m[3]}-${PAY_MON[m[1].toLowerCase()]}-${m[2].padStart(2,'0')}`;
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return iso?iso[0]:''}
const payKey=r=>[r.rcpt,r.lot,r.code].join('|'); // a receipt line for one auction lot — natural unique key
function buildPaymentIndex(){
  ST.auctionPay=new Map();
  for(const r of PAY_ROWS){
    const nk=payNorm(r.code);if(!nk)continue;
    let g=ST.auctionPay.get(nk);
    if(!g){g={no:r.code,norm:nk,rows:[],sold:0,collFee:0,aucFee:0,catFee:0,total:0,tax:0,checks:[],buyers:[],lots:[],dateMin:'',dateMax:''};ST.auctionPay.set(nk,g)}
    g.rows.push(r);
    g.sold+=r.sold;g.collFee+=r.collFee;g.aucFee+=r.aucFee;g.catFee+=r.catFee;g.total+=r.total;g.tax+=r.tax;
    if(r.check&&!g.checks.includes(r.check))g.checks.push(r.check);
    if(r.user&&!g.buyers.includes(r.user))g.buyers.push(r.user);
    if(r.lot&&!g.lots.includes(r.lot))g.lots.push(r.lot);
    if(r.iso){if(!g.dateMin||r.iso<g.dateMin)g.dateMin=r.iso;if(r.iso>g.dateMax)g.dateMax=r.iso}
  }
  for(const g of ST.auctionPay.values())g.rows.sort((a,b)=>(a.iso||'').localeCompare(b.iso||''));
}
const payFor=g=>(g&&g.no)?ST.auctionPay.get(payNorm(g.no)):null;
function parsePaymentReport(wb){
  const rows=[];
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});
    let hi=-1;
    for(let i=0;i<Math.min(aoa.length,15);i++){
      const line=(aoa[i]||[]).map(c=>String(c||'').toLowerCase());
      if(line.some(c=>c.includes('item code'))&&line.some(c=>c.includes('sold')||c.includes('ps check')||c.includes('total'))){hi=i;break}
    }
    if(hi<0)continue;
    const hdr=(aoa[hi]||[]).map(c=>String(c||'').toLowerCase().replace(/\n/g,' ').trim());
    const col=(...ks)=>{for(const k of ks){const ix=hdr.findIndex(h=>h.includes(k));if(ix>=0)return ix}return -1};
    const C={rcpt:col('rcpt #','receipt'),date:col('rcpt date','date'),user:col('user','buyer'),
      lot:col('auction'),code:col('item code','tag'),title:col('title'),sold:col('sold amnt','sold'),
      coll:col('coll fee'),auc:col('auction fee'),cat:col('cat. fee','cat fee'),total:col('total'),
      tax:col('sales tax','tax'),check:col('ps check','check'),dept:col('dept')};
    if(C.code<0)continue;
    const g=(r,i)=>(i>=0&&i<r.length)?String(r[i]==null?'':r[i]).trim():'';
    for(let ri=hi+1;ri<aoa.length;ri++){
      const r=aoa[ri];if(!r||r.every(c=>String(c||'')===''))continue;
      const code=g(r,C.code);if(!code||/^item\s*code/i.test(code))continue;
      const sold=payNum(g(r,C.sold)),total=payNum(g(r,C.total)),title=g(r,C.title);
      if(!sold&&!total&&!title)continue;
      const date=g(r,C.date);
      rows.push({rcpt:g(r,C.rcpt),date,iso:payDate(date),user:g(r,C.user),lot:g(r,C.lot).replace(/\.0+$/,''),
        code,title,sold,collFee:payNum(g(r,C.coll)),aucFee:payNum(g(r,C.auc)),catFee:payNum(g(r,C.cat)),
        total:total||sold,tax:payNum(g(r,C.tax)),check:g(r,C.check),dept:g(r,C.dept)});
    }
  }
  return rows;
}
function previewPaymentImport(wb,name,box){

    if(!rows.length){box.innerHTML=`<div class="note" style="border-color:var(--bad);color:var(--bad)"><b>${esc(name)}</b> — no payment rows found (need an "Item Code/Tag" column with sold amounts).</div>`;return}
    // dedup within the file (last wins), then diff against existing device data
    const inMap=new Map();for(const r of rows)inMap.set(payKey(r),r);
    const incoming=[...inMap.values()];
    const cur=new Map(PAY_ROWS.map(r=>[payKey(r),r]));
