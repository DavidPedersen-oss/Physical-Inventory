    const totalSold=incoming.reduce((n,r)=>n+r.sold,0),totalTax=incoming.reduce((n,r)=>n+r.tax,0),totalColl=incoming.reduce((n,r)=>n+r.total,0);
    const checks=[...new Set(incoming.map(r=>r.check).filter(Boolean))];
    const dates=incoming.map(r=>r.iso).filter(Boolean).sort();
    box.innerHTML=`<div class="card" data-imp-pending><b>${esc(name)}</b> — detected as a <b>Payment Collection Report</b>
      <div class="note">Attaches auction sale &amp; ACH payment info to surveys, matched by survey # (report column <b>Item Code/Tag</b>). Device-local reference data — not pushed to SharePoint. Re-importing a newer report updates existing receipts.</div>
      <table class="plain" style="margin-top:10px"><tr><th></th><th>Count</th></tr>
        <tr><td>Payment line items in file</td><td>${incoming.length.toLocaleString()}</td></tr>
        <tr><td>New receipts to add</td><td>${added.toLocaleString()}</td></tr>
        <tr><td>Existing receipts to update</td><td>${updated.toLocaleString()}</td></tr>
        <tr><td>Distinct survey #s in file</td><td>${codes.size.toLocaleString()}</td></tr>
        <tr><td>…matched to a known survey</td><td>${matched.toLocaleString()}</td></tr>
        <tr><td>Total collected</td><td class="mono">${payMoney(totalColl)}</td></tr>
        <tr><td>Sales tax</td><td class="mono">${payMoney(totalTax)}</td></tr>
        <tr><td>ACH / check references</td><td>${checks.length.toLocaleString()}</td></tr>
        ${dates.length?`<tr><td>Date range</td><td class="mono">${esc(dates[0])} → ${esc(dates[dates.length-1])}</td></tr>`:''}
      </table>
      ${added+updated?'':'<div class="note" style="margin-top:10px;margin-bottom:0">Everything in this file has already been imported — applying again is harmless.</div>'}
      <div class="acts" style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn btn-gold" id="payGo">Apply payment data</button></div></div>`;
    box.querySelector('#payGo').onclick=async()=>{
      const btn=box.querySelector('#payGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Applying…';
      await new Promise(r=>setTimeout(r,30));
      const map=new Map(PAY_ROWS.map(r=>[payKey(r),r]));
      for(const r of incoming)map.set(payKey(r),r);
      PAY_ROWS=[...map.values()];
      await kvSet('auctionPayRows',PAY_ROWS);buildPaymentIndex();
      toast(`Payment data applied — ${added.toLocaleString()} added, ${updated.toLocaleString()} updated`);
      box.innerHTML=`<div class="note" style="border-color:var(--ok);color:var(--ok)">✓ Payment data applied — ${incoming.length.toLocaleString()} line items (${matched.toLocaleString()} matched to surveys, ${payMoney(totalColl)} collected). <a href="#/auctions">Open Auctions →</a></div>`;
    };
  },30);
}

/* ---------------- Ask AI (DeepSeek) ----------------
   The model never sees the raw data — it calls the two query tools
   below, which run locally over ST and return counts + small samples. */
const AI_TOOLS=[
 {type:'function',function:{name:'query_surveys',description:'Search and count property survey (disposal request) line items. Returns matching survey count, line item count, optional grouped counts, and up to 5 sample items.',
  parameters:{type:'object',properties:{
    text:{type:'string',description:'keywords matched against item description, notes, department and survey number (all words must match)'},
    status:{type:'string',enum:['Open','Done'],description:'survey line item status'},
    action:{type:'string',description:'disposal action substring, e.g. AUCTION, DONATION, E-WASTE, RECYCLE, TRANSFER, LOST'},
    category:{type:'string',enum:['NEW','BK','CI','CNI','TR','FDN'],description:'survey category: NEW=New Survey App, BK=Bookstore E-Waste, CI=Campus Inventory, CNI=Campus Non-Inventory, TR=Transfer, FDN=Foundation'},
    department:{type:'string',description:'department name or ID substring'},
    group_by:{type:'string',enum:['action','category','status','department','fiscal_year'],description:'return counts grouped by this field (top 15)'}}}}},
 {type:'function',function:{name:'query_assets',description:'Search and count property assets. Returns count, total dollar value, optional grouped counts, and up to 5 sample assets.',
  parameters:{type:'object',properties:{
    text:{type:'string',description:'keywords matched against tag, description, serial, location, custodian, department'},
    status:{type:'string',enum:['Unreviewed','Verified OK','Not Found','Wrong Location','Damaged','Other'],description:'physical-inventory audit status'},
    department:{type:'string',description:'department name or ID substring'},
    division:{type:'string',description:'division/org substring'},
    disposed:{type:'boolean',description:'true = only disposed/retired assets, false/omitted = only active'},
    no_location:{type:'boolean',description:'true = only assets missing a location'},
    has_survey:{type:'boolean',description:'true = only assets with a survey record on file'},
    group_by:{type:'string',enum:['status','department','division','category'],description:'return counts grouped by this field (top 15)'}}}}}];
function _grp(map,k){k=k||'(blank)';map.set(k,(map.get(k)||0)+1)}
function _top(map,n=15){return Object.fromEntries([...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n))}
function runAiTool(name,args){
  args=args||{};
  const toks=String(args.text||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(name==='query_surveys'){
    const groups=new Set(),g=new Map();let items=0;const sample=[];
    for(const s of ST.surveys){
      if(args.status&&s.st!==args.status)continue;
      if(args.action&&!String(s.act||'').toLowerCase().includes(String(args.action).toLowerCase()))continue;
      if(args.category&&s.cat!==args.category)continue;
      if(args.department){const d=(String(s.dn||'')+' '+String(s.dp||'')+' '+survDeptName(s)).toLowerCase();
        if(!d.includes(String(args.department).toLowerCase()))continue}
      if(toks.length){const hay=[s.d,s.nt,s.dn,s.no,s.act].map(x=>String(x||'')).join(' ').toLowerCase();
        if(!toks.every(t=>hay.includes(t)))continue}
      items++;groups.add(survKey(s));
      if(args.group_by==='action')_grp(g,s.act);else if(args.group_by==='category')_grp(g,SURVCAT[s.cat]||s.cat);
      else if(args.group_by==='status')_grp(g,s.st);else if(args.group_by==='department')_grp(g,survDeptName(s)||survDeptId(s));
      else if(args.group_by==='fiscal_year')_grp(g,s.fy||String(s.no||'').slice(0,2));
      if(sample.length<5)sample.push({survey_no:s.no,category:SURVCAT[s.cat]||s.cat,description:s.d,action:s.act,status:s.st,department:s.dn||survDeptName(s),date_completed:s.dc||null});
    }
    const out={matching_surveys:groups.size,matching_line_items:items,sample};
    if(args.group_by)out['count_by_'+args.group_by]=_top(g);
    if(!ST.archiveLoaded)out.note='Counts cover current data only; ~97,000 archived history line items are not loaded.';
    return out;
  }
  if(name==='query_assets'){
    let count=0,value=0;const g=new Map(),sample=[];
    for(const a of ST.assets.values()){
      const disp=a.lc==='D';
      if(args.disposed===true?!disp:disp)continue;
      if(args.status&&a.status!==args.status)continue;
      if(args.department){const d=(String(a.dept||'')+' '+String(a.deptName||'')+' '+deptLabel(a.dept)).toLowerCase();
        if(!d.includes(String(args.department).toLowerCase()))continue}
      if(args.division&&!String(a.div||'').toLowerCase().includes(String(args.division).toLowerCase()))continue;
      if(args.no_location&&a.location)continue;
      if(args.has_survey&&!((a.survey&&a.survey.length)||(ST.surveyByAsset.get(a.id)||[]).length))continue;
      if(toks.length){const hay=[a.tag,a.id,a.serial,a.desc,a.location,a.custodian,a.deptName,deptLabel(a.dept)].join(' ').toLowerCase();
        if(!toks.every(t=>hay.includes(t)))continue}
      count++;value+=Number(a.value)||0;
      if(args.group_by==='status')_grp(g,disp?'Disposed':a.status);else if(args.group_by==='department')_grp(g,a.deptName||deptLabel(a.dept));
      else if(args.group_by==='division')_grp(g,a.div);else if(args.group_by==='category')_grp(g,a.category);

    }

async function aiComplete(messages){

    headers:{'Content-Type':'application/json','Authorization':'Bearer '+ST.cfg.dsKey},

  if(!r.ok){let d='';try{d=(await r.json()).error?.message||''}catch(e){}
    throw new Error('DeepSeek API '+r.status+(d?' — '+d:r.status===401?' — check your API key in Settings':''))}

async function askDeepSeek(question,onTool){
  const msgs=[{role:'system',content:aiSystemPrompt()},...ST.ai.msgs,{role:'user',content:question}];
  const used=[];
  for(let i=0;i<6;i++){
    const msg=await aiComplete(msgs);
    if(msg.tool_calls&&msg.tool_calls.length){
      msgs.push(msg);
      for(const tc of msg.tool_calls){
        let args={};try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){}
        used.push(tc.function.name+' '+JSON.stringify(args));if(onTool)onTool(used);
        msgs.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(runAiTool(tc.function.name,args))});
      }
      continue;
    }
    // keep a rolling window of the conversation (without the system prompt)
    ST.ai.msgs=msgs.slice(1).filter(x=>x.role==='user'||(x.role==='assistant'&&!x.tool_calls)).slice(-10);
    ST.ai.msgs.push({role:'assistant',content:msg.content});
    ST.ai.msgs=ST.ai.msgs.slice(-10);
    return{text:msg.content,tools:used};
  }
  throw new Error('The assistant got stuck in a tool loop — try rephrasing the question.');
}

async function parseImportFile(file){
  let aoa;
  if(/\.csv$/i.test(file.name)){
    aoa=await new Promise((res,rej)=>Papa.parse(file,{skipEmptyLines:true,complete:r=>res(r.data),error:rej}));
  }else{
    const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:false});
    aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
  }
  const hi=findHeaderRow(aoa);
  if(hi<0)throw new Error('Could not find a header row with "Asset ID" (or Tag # + Description) in the first 12 rows.');
  const{rows,skipped}=normalizeRows(aoaToObjects(aoa,hi));
  if(!rows.length)throw new Error('No rows with a numeric Asset ID found below the header.');
  return{rows,skipped};
}
function mergeImportRows(files){
  // combine rows from several files by Asset ID — later file wins per non-blank field
  const by=new Map();let overlap=0;
  for(const p of files)for(const r of p.rows){
    const ex=by.get(r.id);
    if(!ex){by.set(r.id,{...r});continue}
    overlap++;
    for(const k in r){
      if(k==='id')continue;
      const v=r[k];
      if(k==='value'||k==='netBook'){if(v)ex[k]=v}
      else if(k==='isDisposal')ex[k]=ex[k]||v;
      else if(k==='noteAdd'){if(v&&!(ex.noteAdd||'').includes(v))ex.noteAdd=ex.noteAdd?ex.noteAdd+'; '+v:v}
      else if(String(v??'').length)ex[k]=v;
    }
  }
  return{rows:[...by.values()],overlap};
}
async function handleImportFiles(files){

  // classify each workbook: Master Survey / Inventory Tracker / ordinary asset file
  const surveyWbs=[],trackerWbs=[],paymentWbs=[],assetFiles=[],classErr=[];
  for(const f of files){

async function handleAssetFiles(files,out,priorErrors){
  const parsed=[],errors=[...(priorErrors||[])];

      p.isDisp=p.rows.filter(r=>r.isDisposal).length>p.rows.length/2;parsed.push(p)}

    out.innerHTML=errors.map(e=>`<div class="note" style="border-color:var(--bad);color:var(--bad)"><b>${esc(e.name)}</b> — import failed: ${esc(e.error)}</div>`).join('');

function detectWbType(wb){
  const names=wb.SheetNames.map(n=>n.trim().replace(/\s+/g,' ').toUpperCase());
  if(names.some(n=>/^PHASE\s*\d/.test(n)))return'tracker';
  if(names.some(n=>/(SURVEY APP|TRANSFERS|CMP\s*-?\s*INV|CMP\s*-?\s*NON|BOOKSTORE)/.test(n)))return'survey';
  for(const nm of wb.SheetNames){ // header fallback for renamed sheets
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:''});
    const hdr=(aoa[0]||[]).concat(aoa[1]||[],aoa[2]||[]).map(c=>String(c||'').toLowerCase());
    const has=s=>hdr.some(c=>c.includes(s));
    if(has('on record')&&has('outstanding'))return'tracker';
    if(has('disposal action')&&(has('survey #')||has('logged')))return'survey';
    // Payment Collection Report — the header row sits several rows below a title banner
    const wide=aoa.slice(0,12).flat().map(c=>String(c||'').toLowerCase());
    const hasW=s=>wide.some(c=>c.includes(s));
    if(hasW('item code')&&(hasW('sold amnt')||hasW('ps check')))return'payment';
  }
  return null;
}
/* --- survey workbook (current sheets only; mirrors tools/build_surveys.py) --- */
const SURV_WB_SHEETS={'NEW SURVEY APP':'NEW','BOOKSTORE':'BK','CMP-INV':'CI','CMP-NON-INV':'CNI','TRANSFERS':'TR','FDN':'FDN'};
const svCell=x=>{if(x==null)return'';if(x instanceof Date)return x.toISOString().slice(0,10);
  if(typeof x==='number')return String(x);
  const t=String(x).trim();return /^(nan|nat|none|null)$/i.test(t)?'':t};
const svFind=(hdr,...keys)=>{for(let i=0;i<hdr.length;i++){const h=String(hdr[i]||'').toLowerCase().replace(/\n/g,' ');for(const k of keys)if(h.includes(k))return i}return -1};
function parseSurveyWorkbook(wb){
  const recs=[];let ki=0;const byCat={};
  for(const name of wb.SheetNames){
    const cat=SURV_WB_SHEETS[name.trim().replace(/\s+/g,' ').toUpperCase()];
    if(!cat)continue; // current sheets only — archive stays as-is
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    if(aoa.length<3)continue;
    const hdr=(aoa[1]||[]).map(c=>svCell(c)); // header on row 2
    const C={no:svFind(hdr,'survey #','survey#'),d:svFind(hdr,'description'),aid:svFind(hdr,'asset id'),
      tag:svFind(hdr,'tag'),ser:svFind(hdr,'serial'),yr:svFind(hdr,'in service','acq date','acqdate'),
      amt:svFind(hdr,'original amount','amount'),da:svFind(hdr,'date assigned'),dc:svFind(hdr,'date completed'),
      lb:svFind(hdr,'logged'),cb:svFind(hdr,'closed'),cc:svFind(hdr,'disposal code'),
      cond:svFind(hdr,'disposal condition','condition'),act:svFind(hdr,'disposal action','action'),
      nt:svFind(hdr,'notes'),fy:svFind(hdr,'fy sort','fy')};
    const deptIdx=[],dnameIdx=[];
    hdr.forEach((h,i)=>{const hl=String(h).toLowerCase().replace(/\n/g,' ');
      if(hl.includes('dept id')||hl.includes('dept #')||hl.includes('dept#'))deptIdx.push(i);
      if(hl.includes('dept name'))dnameIdx.push(i)});
    const isTR=cat==='TR',g=(r,i)=>(i>=0&&i<r.length)?svCell(r[i]):'';
    for(let ri=2;ri<aoa.length;ri++){
      const r=aoa[ri];if(!r||r.every(c=>c==null))continue;
      const desc=g(r,C.d),no=g(r,C.no),tag=g(r,C.tag),ser=g(r,C.ser),aid=g(r,C.aid);
      if(!(desc||no||tag||ser))continue;
      const rec={k:'u'+(ki++),cat,ar:0};
      if(no)rec.no=no;if(desc)rec.d=desc;if(aid)rec.aid=aid;if(tag)rec.tag=tag;if(ser)rec.ser=ser;
      for(const f of['yr','amt','da','dc','lb','cb','cc','cond','act','nt','fy']){const v=g(r,C[f]);if(v)rec[f]=v}
      if(isTR&&deptIdx.length>=2){
        const fd=g(r,deptIdx[0]),td=g(r,deptIdx[1]),fdn=dnameIdx.length>=1?g(r,dnameIdx[0]):'',tdn=dnameIdx.length>=2?g(r,dnameIdx[1]):'';
        if(fd)rec.fd=fd;if(td)rec.td=td;if(fdn)rec.fdn=fdn;if(tdn)rec.tdn=tdn;
      }else{
        const dp=deptIdx.length?g(r,deptIdx[0]):'',dn=dnameIdx.length?g(r,dnameIdx[0]):'';
        if(dp)rec.dp=dp;if(dn)rec.dn=dn;
      }
      rec.st=g(r,C.dc)?'Done':'Open';
      recs.push(rec);byCat[cat]=(byCat[cat]||0)+1;
    }
  }
  return{recs,byCat};
}

/* --- FY 25-26 Inventory Tracker (per-department progress) --- */
const trNum=x=>{const n=parseInt(String(x??'').replace(/[^\d-]/g,''),10);return Number.isFinite(n)?n:null};
const trDate=x=>{if(x instanceof Date)return x.toISOString().slice(0,10);const t=String(x??'').trim();return(/\d/.test(t)&&!/^[-\s]+$/.test(t))?t:''};
function parseTrackerWorkbook(wb){
  const byDept={};let sheets=0;
  for(const name of wb.SheetNames){
    if(!/^phase\s*\d/i.test(name.trim()))continue;
    sheets++;
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let hi=aoa.findIndex(r=>(r||[]).some(c=>/dept\s*id/i.test(String(c||'')))&&(r||[]).some(c=>/on record/i.test(String(c||''))));
    if(hi<0)hi=1;
    const hdr=(aoa[hi]||[]).map(c=>String(c||'').toLowerCase().replace(/\n/g,' ').trim());
    const col=(...ks)=>{for(const k of ks){const ix=hdr.findIndex(h=>h===k);if(ix>=0)return ix}for(const k of ks){const ix=hdr.findIndex(h=>h.includes(k));if(ix>=0)return ix}return -1};
    const cId=col('deptid','dept id'),cNm=col('dept name'),cOn=col('on record'),cF=col('found'),
      cS=col('surveyed'),cO=col('outstanding'),cC=col('completed'),cNt=col('notes');
    for(let ri=hi+1;ri<aoa.length;ri++){
      const r=aoa[ri];if(!r)continue;
      const rawId=cId>=0?String(r[cId]??'').trim():'';
      if(!/^\d+$/.test(rawId))continue; // department rows only (skips DIV-AREA subtotals + blanks)
      const id=String(parseInt(rawId,10)),cd=cC>=0?trDate(r[cC]):'';
      byDept[id]={phase:name.trim(),name:cNm>=0?String(r[cNm]??'').trim():'',
        onRecord:cOn>=0?trNum(r[cOn]):null,found:cF>=0?trNum(r[cF]):null,
        surveyed:cS>=0?trNum(r[cS]):null,outstanding:cO>=0?trNum(r[cO]):null,
        completedDate:cd,completed:!!cd,notes:cNt>=0?String(r[cNt]??'').trim():''};
    }
  }
  return{byDept,sheets};
}
function previewTrackerImport(wb,name,box){

      <table class="plain" style="margin-top:10px"><tr><th></th><th>Count</th></tr>

      </table>
      <label class="imp-row" style="cursor:pointer;margin-top:8px"><span>Also mark the <b>${cand.toLocaleString()}</b> Unreviewed asset(s) in completed departments as <b>Verified OK</b> <span class="muted">(UpdatedBy = Tracker Import; pushes to SharePoint)</span></span><input type="checkbox" id="trMark" ${cand?'':'disabled'}></label>
      <div class="acts" style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn btn-gold" id="trGo">Apply tracker</button></div></div>`;
    $('#trGo').onclick=async()=>{
      const mark=$('#trMark').checked,btn=$('#trGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Applying…';
      await new Promise(r=>setTimeout(r,30));
      ST.tracker={file:name,at:nowStr(),byDept};await kvSet('trackerProgress',ST.tracker);
      ST.depts.forEach(d=>{const t=byDept[d.deptId];if(t&&t.completed)d.completed=true});
      await kvSet('depts',ST.depts);
      let nOk=0;
      if(mark){
        for(const a of ST.assets.values()){
          if(a.lc==='D'||a.status!=='Unreviewed'||!(byDept[a.dept]&&byDept[a.dept].completed))continue;
          a.status='Verified OK';await saveAsset(a,[{f:'status',old:'Unreviewed',new:'Verified OK'}],true,'Tracker Import');nOk++;
        }
        if(nOk){await qAdd({kind:'import',payload:{Timestamp:nowStr(),User:ST.session.name,Filename:name,RowsMatched:nOk,RowsAdded:0,RowsConflicted:0,Summary:JSON.stringify({trackerMarkedOK:nOk,completedDepts:done.length})},t:nowStr()});
          ST.pending=(await qAll()).filter(o=>!o.done).length;syncChip();scheduleAutoSync()}
      }
      toast(`Tracker applied — ${ids.length} departments${nOk?`, ${nOk.toLocaleString()} assets marked Verified OK`:''}`);
      box.innerHTML=`<div class="note" style="border-color:var(--ok);color:var(--ok)">✓ Tracker applied — ${ids.length} departments updated${nOk?`, ${nOk.toLocaleString()} assets set to Verified OK`:''}. <a href="#/depts">Open Physical Inventory →</a></div>`;
    };
  },30);
}

function originalOf(a,f){const h=(a.history||[]).find(x=>x.f===f);return h?String(h.old??''):''}
function exportRows(scope){

  if(scope==='audit')list=list.filter(a=>a.lc!=='D'&&(a.status!=='Unreviewed'||(a.history||[]).length));
  else if(scope==='active')list=list.filter(a=>a.lc!=='D');

    <div class="note">Paste the two flow URLs from Power Automate and the shared key set inside the flows. These are saved on this device only — never in the GitHub repo. See the README for flow setup.</div>
    <div class="field"><label>Read flow URL (GET)</label><input id="cgU" class="mono" style="font-size:12px" value="${esc(ST.cfg.getUrl)}" placeholder="https://prod-…logic.azure.com…"></div>
    <div class="field"><label>Write flow URL (POST)</label><input id="cpU" class="mono" style="font-size:12px" value="${esc(ST.cfg.postUrl)}"></div>
    <div class="field"><label>Shared key</label><input id="ckY" class="mono" value="${esc(ST.cfg.key)}"></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn btn-gold" id="cfSave">Save</button>
      <button class="btn" id="cfTest">Test connection</button>
      <button class="btn btn-dark" id="cfSync">Sync now (${ST.pending} pending)</button></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:9px">
      <button class="btn btn-sm btn-gold" id="cfLink">Copy setup link</button>
      <button class="btn btn-sm" id="cfShare">Copy config code</button>
      <button class="btn btn-sm" id="cfPaste">Paste config code</button></div>
    <div class="muted" style="font-size:12.5px;margin-top:9px">
      <b>Set up other devices without retyping:</b> tap <b>Copy setup link</b> and open that link on the other device — sync + AI settings apply automatically. Or commit a <span class="mono">seed/config.json</span> (copy <span class="mono">seed/config.example.json</span>) so every new device picks the settings up on first load — note that anyone who can see the repo or site can read that file.
    </div></div>
  <div class="card"><b style="font-size:15px">AI assistant (DeepSeek)</b>
    <div class="note">Paste a DeepSeek API key (from <span class="mono">platform.deepseek.com</span>) to enable the <b>Ask AI</b> page — natural-language questions about your inventory, e.g. "how many open auction surveys are there for carts?". The key is saved on this device only; the AI receives only question-specific counts and small samples, never the full dataset.</div>
    <div class="field"><label>DeepSeek API key</label><input id="cdsK" type="password" class="mono" value="${esc(ST.cfg.dsKey||'')}" placeholder="sk-…" autocomplete="off"></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn btn-gold" id="cdsSave">Save key</button>
      <button class="btn" data-nav="ask">Open Ask AI</button></div></div>
  <div class="card"><b style="font-size:15px">Sync log</b>
    ${ST.syncLog.length?ST.syncLog.slice(0,12).map(l=>`<div class="hist" style="border-color:${l.ok?'var(--ok)':'var(--bad)'}">
      <b>${l.ok?'OK':'FAILED'}</b> · ${esc(l.t)}<br>${esc(l.msg)}</div>`).join(''):'<div class="muted" style="font-size:13px;margin-top:8px">No syncs yet.</div>'}</div>
  <div class="card"><b style="font-size:15px">Data</b>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px">
      <button class="btn" id="dataPull">Pull latest from SharePoint</button>
      <button class="btn" id="dataClearPay">Clear auction payments${PAY_ROWS.length?` (${PAY_ROWS.length.toLocaleString()})`:''}</button>
      <button class="btn btn-danger" id="dataNuke">🗑 Nuke &amp; rebuild data</button>
      <button class="btn btn-danger" id="dataReset">Reset this device</button></div>
    <div class="muted" style="font-size:12.5px;margin-top:9px">
      <b>Nuke &amp; rebuild</b> wipes local asset/department records and the pending sync queue, then reloads fresh from the bundled seed exports (and re-pulls SharePoint right after, if sync is configured) — keeps your sign-in and sync settings. Use this when local data looks stale or corrupted.<br>
      <b>Clear auction payments</b> removes only the imported Payment Collection Report data (device-local); surveys and auctions are untouched.<br>
      <b>Reset this device</b> is the full factory reset — also erases sign-in and sync settings.
    </div></div>
  <div class="muted" style="font-size:12px;text-align:center;margin-top:10px">Beach Asset Management · CSULB Property Management Office · build 4.2 “Horizon”</div>`;
  m.querySelectorAll('[data-th]').forEach(b=>b.onclick=async()=>{ST.theme=b.dataset.th;document.documentElement.dataset.theme=ST.theme;await kvSet('theme',ST.theme);renderSettings(m)});
  $('#cfSave').onclick=async()=>{ST.cfg={...ST.cfg,getUrl:$('#cgU').value.trim(),postUrl:$('#cpU').value.trim(),key:$('#ckY').value.trim()};
    await kvSet('cfg',ST.cfg);syncChip();toast('Sync settings saved')};
  $('#cdsSave').onclick=async()=>{ST.cfg={...ST.cfg,dsKey:$('#cdsK').value.trim()};
    await kvSet('cfg',ST.cfg);toast(ST.cfg.dsKey?'DeepSeek key saved — Ask AI is live':'DeepSeek key removed')};
  $('#cfTest').onclick=()=>{ST.cfg.getUrl=$('#cgU').value.trim();ST.cfg.key=$('#ckY').value.trim();testConnection()};
  $('#cfSync').onclick=()=>syncNow();
  $('#cfLink').onclick=()=>{
    const u=location.origin+location.pathname+'#setup='+encodeURIComponent(btoa(JSON.stringify(ST.cfg)));
    navigator.clipboard.writeText(u).then(()=>toast('Setup link copied — open it once on any device'))};
  $('#cfShare').onclick=()=>{navigator.clipboard.writeText(btoa(JSON.stringify(ST.cfg))).then(()=>toast('Config code copied — paste it on another device'))};
  $('#cfPaste').onclick=async()=>{
    const v=modal(`<h3>Paste config code</h3><textarea id="ccIn" rows="4" class="mono" style="font-size:12px"></textarea>
      <div class="acts"><button class="btn" data-x>Cancel</button><button class="btn btn-gold" data-ok>Apply</button></div>`);
    v.querySelector('[data-x]').onclick=()=>v.remove();
    v.querySelector('[data-ok]').onclick=async()=>{
      try{ST.cfg=JSON.parse(atob(v.querySelector('#ccIn').value.trim()));await kvSet('cfg',ST.cfg);v.remove();renderSettings(m);syncChip();toast('Config applied')}
      catch(e){toast('Invalid config code',1)}}};
  $('#dataPull').onclick=async()=>{if(!ST.cfg.getUrl){toast('Set the Read flow URL first',1);return}
    ST.busy=true;syncChip();try{await pullData();toast('Pulled latest data')}catch(e){toast('Pull failed: '+e.message,1)}finally{ST.busy=false;syncChip()}};
  $('#dataClearPay').onclick=()=>clearPayments();
  $('#dataNuke').onclick=()=>promptNuke();
  $('#dataReset').onclick=async()=>{
    if(await confirmDlg('Reset this device','All local data, pending changes, and sign-in info on this device will be erased and seed data reloaded. SharePoint is not touched.','Erase and reload',true)){
      idb.close();indexedDB.deleteDatabase('beachprop');setTimeout(()=>location.reload(),150)}};
}
function renderMore(m){
  m.innerHTML=`<div class="page-h"><h2>More</h2></div>`+
    TOOLS.map(([v,l,ic])=>`<div class="card dept-row" data-nav="${v}"><span class="tool-ic">${ic}</span><div class="nm">${l}</div><div class="right muted">›</div></div>`).join('');
}

/* ---------------- command palette ---------------- */
const CMDS=()=>[
  {label:'Search',hint:'Asset lookup home screen',action:()=>location.hash='#/search'},
  {label:'Physical Inventory',hint:'Departments grouped by division, with progress',action:()=>location.hash='#/depts'},
  {label:'All Assets',hint:'Sortable table of every asset',action:()=>location.hash='#/assets'},
  {label:'Surveys',hint:'Disposal requests and their line items',action:()=>location.hash='#/surveys'},
  {label:'Auctions',hint:'Surveys with items headed to auction',action:()=>location.hash='#/auctions'},
  {label:'Ask AI',hint:'Natural-language questions about the inventory (DeepSeek)',action:()=>location.hash='#/ask'},
  {label:'Dashboard',hint:'Stats, charts, data quality',action:()=>location.hash='#/stats'},
  {label:'Import data',hint:'Upload PeopleSoft, PMO, or disposal files',action:()=>location.hash='#/import'},
  {label:'Export',hint:'Download CSV / Excel / full backup',action:()=>location.hash='#/export'},
  {label:'Users',hint:'Manage sign-ins',action:()=>location.hash='#/users'},
  {label:'Settings',hint:'Sync, appearance, data',action:()=>location.hash='#/settings'},
  {label:'Sync now',hint:'Push pending changes & pull latest',action:()=>syncNow()},
  {label:'Scan a tag / QR code',hint:'Camera lookup',action:()=>openScanner()},
  {label:'Toggle theme',hint:ST.theme==='light'?'Switch to dark':'Switch to light',action:async()=>{ST.theme=ST.theme==='light'?'dark':'light';document.documentElement.dataset.theme=ST.theme;await kvSet('theme',ST.theme);if(ST.route.v==='settings')render()}},
  {label:'Clear auction payments',hint:'Remove imported Payment Collection Report data',action:()=>clearPayments()},
  {label:'Nuke & rebuild data',hint:'Wipe local data on this device and reseed fresh',danger:true,action:()=>promptNuke()},
];
let cpEl=null;
function closeCmdPalette(){cpEl?.remove();cpEl=null}
function openCmdPalette(){
  if(cpEl)return;
  const v=document.createElement('div');v.className='modal-veil';v.style.alignItems='flex-start';v.style.paddingTop='min(14vh,110px)';
  v.innerHTML=`<div class="modal cp-modal" style="max-width:560px;padding:0;overflow:visible">
    <div style="padding:6px 14px;border-bottom:1px solid var(--line)"><input id="cpQ" placeholder="Jump to a page, run a command, or search an asset tag…" autocomplete="off" style="border:none;box-shadow:none;padding:10px 2px;font-size:16px"></div>
    <div id="cpList" style="max-height:min(56vh,420px);overflow-y:auto;padding:8px"></div>
    <div style="padding:8px 16px;border-top:1px solid var(--line);font-size:11.5px" class="muted">↑↓ navigate · ↵ select · Esc close</div></div>`;
  v.addEventListener('mousedown',e=>{if(e.target===v)closeCmdPalette()});
  document.body.append(v);cpEl=v;
  const input=v.querySelector('#cpQ'),list=v.querySelector('#cpList');
  let items=[],sel=0;
  const run=item=>{closeCmdPalette();item.action()};
  const paint=()=>{
    const q=input.value.trim().toLowerCase();
    const matches=CMDS().filter(c=>!q||c.label.toLowerCase().includes(q)||c.hint.toLowerCase().includes(q));
    let assetHits=[];
    if(q.length>=2)assetHits=searchAssets(q,'all').slice(0,6).map(a=>({label:(a.tag||a.id)+' — '+a.desc,hint:(a.lc==='D'?'Disposed':a.status)+' · '+(a.deptName||deptLabel(a.dept)),action:()=>openAsset(a.id)}));
    items=[...assetHits,...matches];
    sel=Math.min(sel,Math.max(0,items.length-1));
    list.innerHTML=items.length?items.map((c,i)=>`<button type="button" data-i="${i}" class="cp-item" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;${i===sel?'background:var(--accent-soft)':''}">
      <span style="font-weight:650;font-size:14px;${c.danger?'color:var(--bad)':''}">${esc(c.label)}</span><span class="muted" style="font-size:12px">${esc(c.hint)}</span></button>`).join('')
      :'<div class="muted" style="padding:14px;font-size:13px;text-align:center">No matches</div>';
  };
  input.addEventListener('input',()=>{sel=0;paint()});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);paint()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);paint()}
    else if(e.key==='Enter'){e.preventDefault();if(items[sel])run(items[sel])}
    else if(e.key==='Escape'){closeCmdPalette()}
  });
  list.addEventListener('mousedown',e=>{const b=e.target.closest('[data-i]');if(b)run(items[+b.dataset.i])});
  paint();setTimeout(()=>input.focus(),10);
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){
    if(!$('#app')||!$('#app').classList.contains('on'))return;
    e.preventDefault();cpEl?closeCmdPalette():openCmdPalette();
  }
});

/* ---------------- barcode / QR scanner ---------------- */
let scanStream=null,scanRAF=null;
function stopScanner(){
  if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
}
async function openScanner(){
  if(!('BarcodeDetector'in window)){
    toast('Camera scanning needs a Chromium browser (Chrome/Edge on Android or desktop) — try manual search instead',1);
    return;
  }
  const v=modal(`<h3>Scan a tag or QR code</h3>
    <div class="scan-wrap"><video id="scanVid" playsinline muted autoplay></video><div class="scan-frame"></div></div>
    <div class="muted" style="font-size:12.5px;margin-top:10px">Point the camera at a barcode/QR code on the property tag. Closes automatically on a match.</div>
    <div class="acts"><button class="btn" data-x>Cancel</button></div>`);
  v.querySelector('[data-x]').onclick=()=>{stopScanner();v.remove()};
  v.addEventListener('click',e=>{if(e.target===v)stopScanner()});
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=v.querySelector('#scanVid');video.srcObject=scanStream;
    const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e']});
    const tick=async()=>{
      if(!scanStream)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          const val=codes[0].rawValue.trim();
          stopScanner();v.remove();
          const res=searchAssets(val,'all');
          const exact=res.filter(a=>a.tag.toLowerCase()===val.toLowerCase()||a.id===val.replace(/^0+/,''));
          const hit=exact[0]||res[0];
          if(hit){openAsset(hit.id)}
          else{ST.q=val;location.hash='#/search';toast('Scanned "'+val+'" — no exact match, showing search')}
          return;
        }
      }catch(e){}
      scanRAF=requestAnimationFrame(tick);
    };
    scanRAF=requestAnimationFrame(tick);
  }catch(e){
    toast('Camera unavailable: '+(e.message||e),1);v.remove();
  }
}

/* ---------------- init ---------------- */
$('#lgGo').onclick=doLogin;
$('#lgP').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#logoutBtn').onclick=logout;
$('#cmdBtn').onclick=()=>openCmdPalette();
$('#syncChip').onclick=()=>syncNow();
window.addEventListener('online',()=>{if(ST.pending&&ST.cfg.postUrl)syncNow(true)});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
